# Live reload for the Go server: `air` (or `mise run dev:api`).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/devdeck ./cmd/devdeck"
  entrypoint = ["./tmp/devdeck"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "web", "node_modules", "brand", "dev-plans", "ui-design", "ui-mockup"]
  exclude_regex = ["_test.go"]
  delay = 300
  stop_on_error = true
  log = "tmp/build-errors.log"

  [build.windows]
    cmd = "go build -o ./tmp/devdeck.exe ./cmd/devdeck"
    entrypoint = ["tmp\\devdeck.exe"]

[misc]
  clean_on_exit = true
