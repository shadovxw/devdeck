# GitHub CodeQL: deep semantic security analysis (free for public repos).
# Languages are picked from what exists in the repo: workflows (actions) and the JS in
# ui-mockup today, plus Go once go.mod lands. Results appear under Security → Code scanning.
#
# Branch rulesets should require only the final "CodeQL passed" job.
name: codeql

on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  languages:
    name: Detect languages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        run: |
          langs='{"language":"actions","build-mode":"none"},{"language":"javascript-typescript","build-mode":"none"}'
          if [ -f go.mod ]; then langs="$langs"',{"language":"go","build-mode":"autobuild"}'; fi
          echo "matrix={\"include\":[$langs]}" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"

  codeql-ok:
    name: CodeQL passed
    if: always()
    needs: [languages, analyze]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if analysis failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "CodeQL analysis completed."
