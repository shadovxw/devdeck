# SonarQube Cloud (free for public repos): bugs, code smells, coverage, quality gate.
# OFF until you set it up. To turn it on:
#   1. Sign in at https://sonarcloud.io with GitHub (shadovxw), import shadovxw/devdeck,
#      choose "GitHub Actions" analysis and turn off "Automatic Analysis".
#   2. Repo → Settings → Secrets and variables → Actions:
#        secret   SONAR_TOKEN   = token from SonarQube Cloud
#        variable SONAR_ENABLED = true
#   3. Check the organization / project key below match what SonarQube Cloud shows.
name: sonar

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Cloud
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs history for new-code detection and blame
          persist-credentials: false
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=shadovxw
            -Dsonar.projectKey=shadovxw_devdeck
            -Dsonar.qualitygate.wait=true
