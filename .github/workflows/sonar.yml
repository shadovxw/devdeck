# SonarQube Cloud (free for public repos): bugs, code smells, coverage, quality gate.
# OFF until you set it up. To turn it on:
#   1. Sign in at https://sonarcloud.io with GitHub (shadovxw), import shadovxw/devdeck,
#      choose "GitHub Actions" analysis and turn off "Automatic Analysis".
#   2. Repo → Settings → Secrets and variables → Actions:
#        secret   SONAR_TOKEN   = token from SonarQube Cloud
#        variable SONAR_ENABLED = true
#   3. Check the organization / project key in sonar-project.properties match what SonarQube Cloud shows.
# The job runs the Go and web tests with coverage first, so the quality gate's
# "coverage on new code" condition has numbers to work with.
name: sonar

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Cloud
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs history for new-code detection and blame
          persist-credentials: false
      # Sonar's quality gate wants test coverage on new code. It can only read coverage
      # that exists, so run the tests here first and write one report per language.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go tests with coverage
        run: go test -count=1 -coverprofile=coverage.out ./internal/... ./sdk/... ./plugins/...
      - name: Web tests with coverage
        working-directory: web
        run: |
          npm ci
          npm run test:coverage
      # The web report names files relative to web/; Sonar looks from the repo root.
      - name: Make the web coverage paths relative to the repo root
        run: sed -i 's#^SF:#SF:web/#' web/coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Organisation, project key, sources and coverage report paths are in sonar-project.properties.
          args: >
            -Dsonar.qualitygate.wait=true
