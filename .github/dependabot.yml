version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date (it updates the SHA and the tag comment).
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

