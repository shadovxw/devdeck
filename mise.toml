# Tool versions and tasks. Install everything with `mise install`, then `mise run dev`.
# Node matches the version CI uses (.github/workflows/ci.yml); Go follows go.mod.

[tools]
go = "1.26"
node = "22"
golangci-lint = "2.15.0"
gitleaks = "8.28.0"
"go:github.com/air-verse/air" = "1.67.4"

[tasks."dev:api"]
description = "Go server on 127.0.0.1:7070 with live reload"
run = "air"
env = { DEVDECK_DATA_DIR = ".devdeck/data", DEVDECK_LOG_LEVEL = "debug", DEVDECK_EXTRA_ORIGINS = "http://127.0.0.1:5174,http://localhost:5174" }

[tasks."dev:web"]
description = "Vite dev server on 127.0.0.1:5174, proxying /api and /ws to the Go server"
dir = "web"
run = "npm run dev"

[tasks.dev]
description = "Run the Go server and the web app together, then open http://127.0.0.1:5174"
depends = ["dev:api", "dev:web"]

[tasks."build:web"]
description = "Production build of the web app"
dir = "web"
run = "npm run build"

[tasks.build]
description = "Build the web app and bin/devdeck.exe, with the web app inside it (one file runs everything)"
depends = ["build:web"]
run = "go build -tags embedui -o bin/devdeck.exe ./cmd/devdeck"

[tasks."test:go"]
description = "Go tests (CI adds -race on Linux; it needs a C compiler, which Windows lacks)"
run = "go test -count=1 ./..."

[tasks."test:web"]
description = "Vitest for the web app"
dir = "web"
run = "npm test"

[tasks.test]
description = "All tests"
depends = ["test:go", "test:web"]

[tasks."lint:go"]
description = "go vet and golangci-lint"
run = ["go vet ./...", "golangci-lint run"]

[tasks."lint:web"]
description = "ESLint and the TypeScript check"
dir = "web"
run = ["npm run lint", "npm run typecheck"]

[tasks.lint]
description = "All linters"
depends = ["lint:go", "lint:web"]

[tasks.secrets]
description = "gitleaks over the whole git history and the working tree, like the CI job (known fakes: .gitleaksignore)"
run = "gitleaks detect --source . --redact --no-banner"

[tasks.check]
description = "Everything CI checks that can run here: linters, tests and the secret scan"
depends = ["lint", "test", "secrets"]

[tasks.app]
description = "Build bin/devdeck-app.exe: devdeck in a window of its own, with the web app inside"
depends = ["build:web"]
run = "go build -tags desktop,production,embedui -ldflags \"-H windowsgui\" -o bin/devdeck-app.exe ./cmd/devdeck"

[tasks.package]
description = "Build dist/devdeck-setup-<version>.exe: the installer (needs Inno Setup: winget install --id JRSoftware.InnoSetup -e)"
depends = ["build:web"]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1"
