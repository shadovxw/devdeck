# SonarQube Cloud settings for devdeck. The analysis itself runs in
# .github/workflows/sonar.yml, which first writes the two coverage reports named below.
sonar.organization=shadovxw
sonar.projectKey=shadovxw_devdeck
sonar.sourceEncoding=UTF-8

# What is analysed. Test files sit next to the code, so the same folders are listed
# as tests and the patterns below say which files are tests.
sonar.sources=cmd,internal,sdk,plugins,web/src
sonar.tests=cmd,internal,sdk,plugins,web/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,web/src/test/**

# Not analysed at all: test fixtures, and the shadcn components copied into the repo as they are.
sonar.exclusions=**/testdata/**,web/src/components/ui/**

# Analysed, but not counted in the coverage number: the program's wiring (main.go), the
# web entry file, the Wails window (built only with -tags desktop and needs a real
# WebView2 window) and the Windows process-group code (its tests run on Windows, the
# coverage run is on Linux), which only tests that start the whole app could reach.
sonar.coverage.exclusions=cmd/**,web/src/main.tsx,internal/desktop/window.go,sdk/proc/group_windows.go

# Coverage reports written by the workflow before the scan.
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
