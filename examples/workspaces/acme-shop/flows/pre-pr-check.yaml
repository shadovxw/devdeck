# yaml-language-server: $schema=../../../../internal/workspace/schemas/flow.schema.json
version: 1
name: pre-pr-check
description: Look for secrets and known vulnerabilities before opening a pull request.

trigger:
  manual: true

# Run the whole flow once for every repo in the workspace.
for_each: repo

# "uses" names a devdeck plugin action here. It is not a GitHub Actions step, so the
# GitHub Actions pinning rule does not apply (hence the nosemgrep comments).
steps:
  - id: secrets
    uses: gitleaks.scan # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

  - id: vulnerabilities
    uses: trivy.scan # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    needs: [secrets]
    gate: steps.vulnerabilities.outputs.findings_count == 0
