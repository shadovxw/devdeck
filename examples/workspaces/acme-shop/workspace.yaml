# yaml-language-server: $schema=../../../internal/workspace/schemas/workspace.schema.json
version: 1
name: acme-shop
description: A demo shop made of an API, a web app and its infrastructure.

# The folder that holds the repositories: absolute, starting with ~, or relative to this file.
root: ~/code/acme-shop

# Used by repos that match no account rule.
default_connection: github-main

repos:
  - id: api
    path: api
    type: go
    remote: github.com/acme/shop-api
    # Docker images built from this repo. devdeck builds and pushes the one you pick when you
    # type a tag on the Images page, with the Docker Hub account that owns the namespace.
    images:
      - id: api
        repository: acme/shop-api
        # dockerfile: Dockerfile     # relative to the repo
        # context: .                 # relative to the repo
        # platforms: [linux/amd64]
        # account: acme-bot          # a Docker account on this machine, if the namespace alone is ambiguous
        # Build secrets the Dockerfile asks for (RUN --mount=type=secret,id=gh_token). Only where each
        # comes from is written here: github is the token of the GitHub account devdeck picks for this
        # repo; keyring is a named secret you saved in your OS keychain on the Docker Hub page.
        secrets:
          - id: gh_token
            from: github
  - id: web
    path: web
    type: node
    remote: github.com/acme/shop-web
  - id: infra
    path: infra
    type: docker
    remote: github.com/acme/shop-infra

# Accounts and services. Tokens and passwords never go here: devdeck keeps them in your OS keychain.
connections:
  - id: github-main
    type: github
    identity:
      name: Alex Example
      email: alex@example.com

# Which connection owns which remote.
account_rules:
  - match: github.com/acme/*
    connection: github-main
