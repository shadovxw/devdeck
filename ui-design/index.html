<style>
/* Layout: floating icon dock + status strip + 12-col bench grid. One 3D hero (the running stack); everything else quiet, flat, precise. */
:root {
  --font-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "Cascadia Code", Consolas, monospace;

  /* dark first */
  --bg: #0c1012;
  --surface-1: #151c20;
  --surface-2: #1b2428;
  --fill: #1f292d;
  --fill-hover: #273338;
  --surface-inset: #090c0e;
  --line: rgba(170, 215, 225, .09);
  --line-strong: rgba(170, 215, 225, .18);
  --ink: #e6edef;
  --ink-2: #a7b4b8;
  --ink-3: #788890;
  --accent: #53d3e6;
  --accent-soft: rgba(83, 211, 230, .14);
  --on-accent: #04252b;
  --hi: rgba(255, 255, 255, .045);
  --shadow: rgba(0, 0, 0, .55);
  --sheen: rgba(83, 211, 230, .07);
  --hero-top: rgba(83, 211, 230, .07);
  --scrim: rgba(3, 6, 8, .45);
  /* 3D materials */
  --bench: #10171a;
  --grid: #24343a;
  --node: #2b383d;
  --edge: #5d7178;
  /* status (fixed in both themes; always with icon + label) */
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --neutral: #788890;
  /* chart series (validated: dark steps) */
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;

  --r-ctl: 4px;
  --r-card: 4px;
  --r-sheet: 6px;
  --r-tag: 3px;
  --ease-out: cubic-bezier(.2, .7, .2, 1);
  --ease-move: cubic-bezier(.22, .9, .24, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e8edef; --surface-1: #fbfcfc; --surface-2: #ffffff; --surface-inset: #e4eaec; --fill: #e4eaec; --fill-hover: #d8e1e4;
    --line: rgba(12, 40, 48, .10); --line-strong: rgba(12, 40, 48, .20);
    --ink: #0d1517; --ink-2: #3d4b50; --ink-3: #5f6f75;
    --accent: #0a7c8f; --accent-soft: rgba(10, 124, 143, .10); --on-accent: #ffffff;
    --hi: rgba(255, 255, 255, .8); --shadow: rgba(16, 40, 48, .20); --sheen: rgba(10, 124, 143, .05);
    --hero-top: rgba(10, 124, 143, .06); --scrim: rgba(13, 21, 23, .18);
    --bench: #e8eef0; --grid: #c9d5d9; --node: #f4f7f8; --edge: #8a9ca2; --neutral: #5f6f75;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e8edef; --surface-1: #fbfcfc; --surface-2: #ffffff; --surface-inset: #e4eaec; --fill: #e4eaec; --fill-hover: #d8e1e4;
  --line: rgba(12, 40, 48, .10); --line-strong: rgba(12, 40, 48, .20);
  --ink: #0d1517; --ink-2: #3d4b50; --ink-3: #5f6f75;
  --accent: #0a7c8f; --accent-soft: rgba(10, 124, 143, .10); --on-accent: #ffffff;
  --hi: rgba(255, 255, 255, .8); --shadow: rgba(16, 40, 48, .20); --sheen: rgba(10, 124, 143, .05);
  --hero-top: rgba(10, 124, 143, .06); --scrim: rgba(13, 21, 23, .18);
  --bench: #e8eef0; --grid: #c9d5d9; --node: #f4f7f8; --edge: #8a9ca2; --neutral: #5f6f75;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/20px var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- shell ---------- */
.app {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  gap: 16px;
  max-width: 1520px;
  margin: 0 auto;
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.dock {
  position: sticky;
  top: calc(16px + env(safe-area-inset-top, 0px));
  align-self: start;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 0;
  background: var(--surface-1);
  border-radius: var(--r-sheet);
}
.dock .logo { width: 36px; height: 36px; margin-bottom: 8px; display: grid; place-items: center; border-radius: var(--r-ctl); --mark-prompt: #4ee8b5; --mark-under: #2aeab4; }
.dock .logo:hover { background: var(--accent-soft); }
.dock .logo svg { width: 30px; height: 30px; display: block; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .dock .logo { --mark-prompt: #0b0f12; --mark-under: #0b0f12; } }
:root[data-theme="light"] .dock .logo { --mark-prompt: #0b0f12; --mark-under: #0b0f12; }
.dock hr { width: 24px; border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.dock-btn {
  position: relative;
  width: 40px; height: 40px; border-radius: var(--r-ctl); border: 0; background: transparent;
  display: grid; place-items: center; color: var(--ink-3); cursor: pointer;
  transition: background 100ms, color 100ms;
}
.dock-btn svg { width: 20px; height: 20px; }
.dock-btn:hover { background: var(--accent-soft); color: var(--ink); }
.dock-btn[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.dock-btn[aria-current="page"]::before {
  content: ""; position: absolute; left: -9px; top: 10px; bottom: 10px; width: 2px; border-radius: 2px;
  background: var(--accent);
}
.dock-btn .tip {
  position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%) translateX(-4px);
  padding: 4px 8px; border-radius: var(--r-ctl); background: var(--ink);
  color: var(--bg); font-size: 12px; white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity 100ms, transform 100ms; z-index: 5;
}
.dock-btn:hover .tip, .dock-btn:focus-visible .tip { opacity: 1; transform: translateY(-50%); }
.dock .badge {
  position: absolute; top: 6px; right: 6px; min-width: 15px; height: 15px; padding: 0 4px;
  border-radius: 999px; background: var(--critical); color: #fff; font: 600 10px/15px var(--font-ui);
}

.main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }

.strip {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px;
  background: var(--surface-1); border-radius: var(--r-sheet);
}
.strip .spacer { flex: 1; }
.chipbtn {
  height: 30px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px;
  border-radius: var(--r-ctl); border: 0; background: transparent; cursor: pointer;
  color: var(--ink-2); font-size: 13px; white-space: nowrap;
  transition: background 100ms, color 100ms;
}
.chipbtn:hover { background: var(--accent-soft); color: var(--ink); }
.chipbtn b { color: var(--ink); font-weight: 600; }
.ws { color: var(--ink); font-weight: 600; background: var(--fill); }
.meterlbl { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); padding: 0 6px; }
.meterlbl .meter { width: 54px; }
.search {
  height: 30px; display: inline-flex; align-items: center; gap: 10px; padding: 0 8px 0 10px;
  min-width: 230px; border-radius: var(--r-ctl); border: 0; background: var(--fill);
  color: var(--ink-3); cursor: pointer; font-size: 13px;
}
.search:hover { background: var(--fill-hover); color: var(--ink-2); }
.search svg { width: 15px; height: 15px; }
kbd {
  white-space: nowrap;
  font: 500 11px/1 var(--font-mono); padding: 3px 5px; border-radius: var(--r-tag);
  border: 0; background: var(--surface-1); color: var(--ink-2);
}
.search kbd { margin-left: auto; }
.iconbtn {
  width: 30px; height: 30px; display: grid; place-items: center; border-radius: var(--r-ctl);
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
}
.iconbtn:hover { background: var(--accent-soft); color: var(--ink); }
.iconbtn[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.iconbtn svg { width: 17px; height: 17px; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn {
  height: 34px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px;
  border-radius: var(--r-ctl); border: 0; background: var(--fill);
  color: var(--ink); font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap;
  transition: background 100ms, border-color 100ms, transform 100ms, color 100ms;
}
.btn:hover { background: var(--fill-hover); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--accent-soft); color: var(--ink); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.danger-armed { color: #fff; background: var(--critical); }

/* ---------- cards ---------- */
.card {
  position: relative; min-width: 0;
  background: var(--surface-1);
  border: 0;
  border-radius: var(--r-card);
  animation: rise 520ms var(--ease-out) backwards;
  animation-delay: calc(var(--i, 0) * 40ms);
}
@keyframes rise { from { transform: translateY(8px); opacity: .35; } to { transform: none; opacity: 1; } }
.tilt { transition: transform 120ms var(--ease-out); will-change: transform; }
.tilt::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), var(--sheen), transparent 65%);
  opacity: 0; transition: opacity 180ms;
}
.tilt:hover::after { opacity: 1; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; }
.card-h h2 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: -.005em; }
.card-h .sub { color: var(--ink-3); font-size: 12px; }
.card-h .grow { flex: 1; min-width: 0; }
.card-b { padding: 12px 16px 16px; }
.card-f { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 16px 14px; color: var(--ink-3); font-size: 12px; }
.link { color: var(--accent); text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; font-size: 12px; font-weight: 500; }
.link:hover { text-decoration: underline; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
.s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }

/* ---------- status ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px;
  border-radius: var(--r-tag); font-size: 12px; font-weight: 500; white-space: nowrap; color: var(--ink);
  background: color-mix(in srgb, var(--c) 15%, transparent);
}
.pill .si { color: var(--c); }
.si { width: 9px; height: 9px; flex: none; display: inline-block; }
[data-s="good"] { --c: var(--good); }
[data-s="warning"] { --c: var(--warning); }
[data-s="serious"] { --c: var(--serious); }
[data-s="critical"] { --c: var(--critical); }
[data-s="neutral"] { --c: var(--neutral); }
.flash { animation: flash 900ms var(--ease-out); }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 35%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* entity chip */
.chip {
  display: inline-flex; align-items: center; gap: 5px; vertical-align: baseline;
  font: 500 12px/18px var(--font-mono); padding: 0 6px; border-radius: var(--r-tag);
  background: var(--fill); border: 0; color: var(--ink-2);
  cursor: pointer; white-space: nowrap;
}
.chip:hover { color: var(--ink); background: var(--fill-hover); }
.chip svg { width: 11px; height: 11px; color: var(--ink-3); }

/* ---------- hero (3D) ---------- */
.hero { height: clamp(540px, 68vh, 760px); overflow: hidden; padding: 0;
  background: radial-gradient(120% 90% at 50% 0%, var(--hero-top), transparent 70%), var(--surface-1); }
#scene { position: absolute; inset: 0; cursor: grab; touch-action: pan-y; }
#scene.dragging { cursor: grabbing; }
#scene canvas { display: block; width: 100%; height: 100%; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.nl {
  position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 7px; border-radius: var(--r-tag); white-space: nowrap;
  font: 500 11px/16px var(--font-mono); color: var(--ink-2);
  background: color-mix(in srgb, var(--surface-2) 86%, transparent);
  transition: color 100ms, background 100ms;
}
.nl.hot { color: var(--on-accent); background: var(--accent); z-index: 2; }
.nl.hot .extra { color: inherit; opacity: .8; }
.nl .extra { color: var(--ink-3); }
.ov { position: absolute; z-index: 3; }
.ov-tl { top: 16px; left: 16px; right: 16px; display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
.ov-tl > * { pointer-events: auto; }
.kpi { display: flex; align-items: baseline; gap: 8px; }
.kpi .big { font: 600 40px/44px var(--font-ui); letter-spacing: -.03em; }
.kpi .big span { color: var(--ink-3); font-weight: 500; font-size: 24px; letter-spacing: -.01em; }
.kpi-cap { font-size: 13px; color: var(--ink-3); }
.tally { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; font-size: 12px; color: var(--ink-3); margin-right: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.ov-bl { left: 16px; bottom: 16px; max-width: min(400px, calc(100% - 32px)); }
.ov-br { right: 16px; bottom: 16px; display: flex; gap: 6px; align-items: center; }
.alert {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 6px 6px 12px; border-radius: var(--r-card);
  background: color-mix(in srgb, var(--surface-2) 88%, transparent);
  backdrop-filter: blur(8px);
}
.alert .si { color: var(--critical); }
.alert .t { font-weight: 600; margin-right: 4px; }
#fallback { position: absolute; inset: 0; padding: 104px 16px 16px; overflow: auto; }
#fallback .fb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.fb-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r-ctl); background: var(--fill); border: 0; cursor: pointer; text-align: left; color: var(--ink); }
.fb-item:hover { background: var(--fill-hover); }
.fb-item .mono { font-size: 12px; overflow: hidden; text-overflow: ellipsis; }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.stat { padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto auto; gap: 2px 12px; cursor: pointer; text-align: left; color: inherit; }
.stat .label, .stat .val, .stat .delta { grid-column: 1; }
.stat .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.stat .val { font: 600 28px/34px var(--font-ui); letter-spacing: -.02em; }
.stat .val small { font-size: 15px; color: var(--ink-3); font-weight: 500; letter-spacing: 0; }
.stat .delta { font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; }
.stat svg.spark { grid-row: 1 / 4; grid-column: 2; align-self: end; }

/* ---------- table ---------- */
.twrap { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 520px; }
th {
  position: sticky; top: 0; z-index: 1; text-align: left; white-space: nowrap;
  padding: 0 12px; height: 34px; background: var(--surface-1);
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600;
  border-bottom: 1px solid var(--line-strong);
}
th.r, td.r { text-align: right; }
th button { background: none; border: 0; padding: 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button:hover { color: var(--ink); }
th button[aria-sort] .arr { color: var(--accent); }
td { padding: 0 12px; height: 42px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
tbody tr { cursor: pointer; transition: background 100ms; }
tbody tr:hover, tbody tr:focus-visible { background: var(--surface-2); outline: none; }
tbody tr:focus-visible td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
tbody tr.sel { background: var(--accent-soft); }
tbody tr:last-child td { border-bottom: 0; }
td .svcname { font: 500 13px var(--font-mono); color: var(--ink); }
td .kind { font-size: 11px; color: var(--ink-3); margin-left: 6px; }
.cellflex { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.meter { height: 4px; width: 60px; border-radius: 999px; background: var(--surface-inset); overflow: hidden; display: inline-block; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width 500ms var(--ease-out); }
.rowact { display: inline-flex; gap: 2px; opacity: 0; transition: opacity 100ms; }
tbody tr:hover .rowact, tbody tr:focus-within .rowact, tbody tr:focus-visible .rowact { opacity: 1; }
.rowact .iconbtn { width: 28px; height: 28px; }
.errn { font-family: var(--font-mono); }
.errn.has { color: var(--ink); font-weight: 600; }

/* ---------- lists ---------- */
.feed { list-style: none; margin: 0; padding: 4px 0; }
.feed li { display: grid; grid-template-columns: 44px 14px 1fr; gap: 10px; padding: 9px 16px; align-items: start; }
.feed li + li { border-top: 1px solid var(--line); }
.feed .time { font: 12px/20px var(--font-mono); color: var(--ink-3); }
.feed .si { margin-top: 6px; color: var(--c); }
.feed .txt { min-width: 0; color: var(--ink-2); font-size: 13px; line-height: 20px; }
.feed .txt b { color: var(--ink); font-weight: 600; }
.feed li.new { animation: slidein 360ms var(--ease-move); }
@keyframes slidein { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- charts ---------- */
.seg { display: inline-flex; padding: 2px; border-radius: var(--r-ctl); background: var(--fill); }
.seg button { height: 24px; width: 30px; display: grid; place-items: center; padding: 0; border: 0; border-radius: var(--r-tag); background: transparent; color: var(--ink-3); font-size: 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface-1); color: var(--ink); }
.seg svg { width: 14px; height: 14px; }
.chart { height: 240px; width: 100%; }
.ctable { max-height: 240px; overflow: auto; }
.ctable table { min-width: 0; }
.ctable td, .ctable th { height: 30px; font-size: 12px; }
.ctable td { font-family: var(--font-mono); }

/* ---------- work items ---------- */
.wi { padding: 12px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.wi + .wi { border-top: 1px solid var(--line); }
.wi-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.wi-top .name { font: 600 13px var(--font-mono); }
.wi-top .meta { color: var(--ink-3); font-size: 12px; margin-left: auto; }
.track { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: relative; }
.track::before { content: ""; position: absolute; left: 10%; right: 10%; top: 9px; height: 2px; background: var(--line-strong); border-radius: 2px; }
.track .fill { position: absolute; left: 10%; top: 9px; height: 2px; background: var(--accent); border-radius: 2px; }
.st { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-3); }
.st .dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-1); border: 2px solid var(--line-strong); color: var(--ink-3); }
.st .dot svg { width: 10px; height: 10px; }
.st.done .dot { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.st.now .dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.st.now { color: var(--ink); font-weight: 600; }
.st.fail .dot { border-color: var(--critical); background: color-mix(in srgb, var(--critical) 20%, var(--surface-1)); color: var(--critical); }
.st.fail { color: var(--ink); font-weight: 600; }

/* ---------- findings grid ---------- */
.hg { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(5, minmax(0, 1fr)); gap: 4px; }
.hg .hd { font-size: 11px; color: var(--ink-3); text-align: center; padding-bottom: 2px; letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hg .rl { font: 500 12px/30px var(--font-mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hg .cell {
  height: 30px; border-radius: var(--r-tag); display: grid; place-items: center;
  font: 500 12px var(--font-mono); color: var(--ink-3);
  background: var(--fill);
}
.hg .cell[data-s] { color: var(--ink); background: color-mix(in srgb, var(--c) 24%, var(--surface-1)); }
.hg .cell.na { background: transparent; }
.keyrow { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--ink-3); }
.keyrow span { display: inline-flex; gap: 5px; align-items: center; }
.keyrow .si { color: var(--c); }

/* ---------- images ---------- */
.img { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 16px; align-items: center; }
.img + .img { border-top: 1px solid var(--line); }
.img .nm { font: 500 13px var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tags { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font: 12px var(--font-mono); color: var(--ink-3); }
.tags .t { padding: 1px 6px; border-radius: var(--r-tag); background: var(--fill); color: var(--ink-2); }
.tags .t.next { background: var(--accent-soft); color: var(--accent); }
.capsule { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; }
.cap { position: relative; height: 22px; border-radius: var(--r-tag); overflow: hidden; background: var(--fill); font-size: 11px; color: var(--ink-3); display: grid; place-items: center; }
.cap.done { background: var(--accent-soft); color: var(--ink); }
.cap.run { color: var(--ink); }
.cap.run::before { content: ""; position: absolute; inset: 0; width: 62%; background: var(--accent-soft); }
.cap.run::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--sheen), transparent); animation: sweep 1.4s linear infinite; }
.cap span { position: relative; z-index: 1; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ---------- overlays ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 220ms; z-index: 40; }
.scrim.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 41;
  width: min(500px, 100%); overflow-y: auto;
  background: var(--surface-2);
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 22px;
  transform: translateX(104%); visibility: hidden;
  transition: transform 340ms var(--ease-move), visibility 0s linear 340ms;
}
.sheet.open { transform: none; visibility: visible; transition: transform 340ms var(--ease-move), visibility 0s; }
.sheet-h { display: flex; align-items: flex-start; gap: 10px; }
.sheet-h .grow { flex: 1; min-width: 0; }
.sheet h2 { margin: 8px 0 2px; font: 500 18px/24px var(--font-mono); overflow-wrap: anywhere; }
.sheet h3 { margin: 22px 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; margin: 16px 0 0; border-radius: var(--r-card); overflow: hidden; }
.facts div { background: var(--fill); padding: 10px 12px; }
.facts dt { font-size: 11px; color: var(--ink-3); }
.facts dd { margin: 2px 0 0; font: 500 14px var(--font-mono); }
.errlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.errlist li { padding: 10px 12px; border-radius: var(--r-ctl); background: var(--fill); font: 12px/18px var(--font-mono); color: var(--ink-2); overflow-wrap: anywhere; }
.errlist .where { display: block; margin-top: 4px; color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; font: inherit; text-align: left; }
.errlist .where:hover { text-decoration: underline; }
.sheet svg.spark { display: block; width: 100%; height: auto; }
.sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
.linked { display: flex; gap: 6px; flex-wrap: wrap; }

.palette-wrap { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: center; align-items: flex-start; padding: calc(12vh + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); background: var(--scrim); }
.palette {
  width: min(640px, 100%); border-radius: var(--r-sheet); overflow: hidden;
  background: var(--surface-2);
  animation: pop 180ms var(--ease-out);
}
@keyframes pop { from { transform: translateY(-6px) scale(.985); opacity: 0; } to { transform: none; opacity: 1; } }
.palette-in { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.palette-in svg { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
.palette input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 16px var(--font-ui); }
.palette input::placeholder { color: var(--ink-3); }
.plist { max-height: min(420px, 60vh); overflow-y: auto; padding: 6px; margin: 0; list-style: none; }
.plist .grp { padding: 8px 10px 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.pitem { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-ctl); cursor: pointer; color: var(--ink-2); }
.pitem .pt { color: var(--ink); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem .ph { font-size: 12px; color: var(--ink-3); }
.pitem svg { width: 16px; height: 16px; flex: none; }
.pitem[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
.pempty { padding: 18px 16px; color: var(--ink-3); }
.pfoot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }

.toasts { position: fixed; z-index: 60; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 8px; }
.toast {
  display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: start;
  padding: 12px 12px 12px 14px; border-radius: var(--r-card);
  background: var(--surface-2);
  box-shadow: 0 24px 64px -24px var(--shadow);
  animation: toastin 220ms var(--ease-move);
}
@keyframes toastin { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast .si { margin-top: 6px; color: var(--c); }
.toast .tt { font-weight: 600; }
.toast .tb { grid-column: 2; color: var(--ink-2); font-size: 13px; }
.toast .ta { grid-column: 2; display: flex; gap: 6px; margin-top: 8px; }
.toast .x { grid-row: 1; grid-column: 3; }

.hovercard {
  position: fixed; z-index: 45; width: 260px; padding: 12px; border-radius: var(--r-card);
  background: var(--surface-2);
  box-shadow: 0 20px 48px -20px var(--shadow); pointer-events: none;
  animation: pop 140ms var(--ease-out);
}
.hovercard .hn { font: 500 13px var(--font-mono); margin: 8px 0 6px; overflow-wrap: anywhere; }
.hovercard .hf { display: flex; gap: 14px; font-size: 12px; color: var(--ink-3); }
.hovercard .hf b { color: var(--ink); font: 500 12px var(--font-mono); }


/* ---------- performance mode + responsive ---------- */
.perf .tilt { transform: none !important; }
.perf .tilt::after { display: none; }

@media (max-width: 1320px) {
  .meterlbl { display: none; }
  .search { min-width: 200px; }
}
@media (max-width: 1180px) {
  .s4, .s5, .s6, .s7, .s8 { grid-column: span 12; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #strip-build .mono { display: none; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .dock { position: static; flex-direction: row; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 6px; justify-content: flex-start; }
  .dock::-webkit-scrollbar { display: none; }
  .dock .logo, .dock-btn, .dock hr { flex: none; }
  .dock .logo { margin: 0 6px 0 0; }
  .dock hr { width: 1px; height: 24px; border-top: 0; border-left: 1px solid var(--line); margin: 0 4px; }
  .dock-btn[aria-current="page"]::before { left: 10px; right: 10px; top: auto; bottom: -7px; width: auto; height: 2px; }
  .dock-btn .tip { display: none; }
  .search { min-width: 0; flex: 1 1 160px; }
  .search .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h1 { font-size: 34px; line-height: 38px; }
  .hero { height: 380px; }
  .legend { display: none; }
  .ov-bl { right: 16px; bottom: 60px; }
  .stats { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .stat .val { font-size: 22px; line-height: 28px; }
  .stat svg.spark { display: none; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hg { grid-template-columns: minmax(0, 1.2fr) repeat(5, minmax(0, 1fr)); }
  .hg .hd { font-size: 10px; }
}
/* phones and narrow VS Code panels: the hero becomes its 2D twin, in normal flow */
@media (max-width: 640px) {
  .hero { height: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .hero .ov { position: static; }
  .ov-tl { flex-direction: column; }
  #scene, #labels { display: none; }
  #fallback { position: static; padding: 0; overflow: visible; }
  #fallback .fb-grid { grid-template-columns: minmax(0, 1fr); }
  .ov-bl { max-width: none; order: -1; }
  .ov-tl { order: -2; }
  .ov-br { justify-content: flex-end; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}

<script>

  const SVC = [

    { id: "ticket", name: "infrabot-ticket-service", short: "ticket", kind: "go", port: 8083, s: "good", cpu: 5, ram: 180, err: 5, up: "1h 12m", pid: "20512", deps: ["postgres", "nats"], pos: [0, 0.1], db: "infrabot_ticket_db", img: "citiuscloud/infrabot-ticket-service:1.0.56", wi: "fix-ticket-retry",

    { id: "agents", name: "infrabot-orchestrate-agents", short: "agents", kind: "python", port: 8000, s: "good", cpu: 1, ram: 540, err: 0, up: "2h 10m", pid: "19480", deps: ["ticket"], pos: [3.3, 3.5], img: "citiuscloud/infrabot-agent:0.0.93" },

  SVC.forEach((s) => {
    s.short = s.short || s.name;

    s.restarts = s.restarts || 0;
    s.hist = s.s === "good" || s.s === "warning" ? series(30, Math.max(.4, s.cpu), Math.max(.6, s.cpu * .5)) : Array(30).fill(0);

  // ---------- icons ----------
  const ICON = {
    good: '<circle cx="5" cy="5" r="4.2" fill="currentColor"/>',
    warning: '<path d="M5 .6 9.6 9H.4z" fill="currentColor"/>',
    serious: '<path d="M5 .3 9.7 5 5 9.7.3 5z" fill="currentColor"/>',

  const si = (s) => `<svg class="si" viewBox="0 0 10 10" aria-hidden="true">${ICON[s]}</svg>`;
  const pill = (s, label) => `<span class="pill" data-s="${s}">${si(s)}${esc(label || STATUS[s])}</span>`;

    run: '<path d="M7 4l12 8-12 8z"/>',

  // ---------- dock ----------

    ["Stacks", '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17.5l9 5 9-5"/>'],
    ["Logs", '<path d="M4 6h16M4 10h10M4 14h16M4 18h8"/>', false, 7],

    "|",
    ["Repositories", '<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 5-12 2-12 7"/>'],
    ["Work items", '<path d="M4 6h2M9 6h11M4 12h2M9 12h11M4 18h2M9 18h11"/>'],
    ["Databases", KIND_ICON.db],

  // ---------- toasts ----------
  function toast({ s = "good", title, body = "", actions = [], sticky = false }) {
    const box = $("#toasts");
    const el = document.createElement("div");
    el.className = "toast"; el.dataset.s = s; el.setAttribute("role", s === "critical" ? "alert" : "status");
    el.innerHTML = `${si(s)}<div class="tt">${esc(title)}</div><button class="iconbtn x" type="button" aria-label="Dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>${body ? `<div class="tb">${body}</div>` : ""}${actions.length ? `<div class="ta">${actions.map((a, i) => `<button class="btn sm ${i === 0 ? "primary" : ""}" type="button" data-i="${i}">${esc(a.label)}</button>`).join("")}</div>` : ""}`;
    const close = () => { el.remove(); };
    el.querySelector(".x").addEventListener("click", close);
    el.querySelectorAll(".ta button").forEach((b) => b.addEventListener("click", () => { actions[+b.dataset.i].fn(); close(); }));
    box.appendChild(el);
    while (box.children.length > 3) box.firstElementChild.remove();
    if (!sticky && s !== "critical") setTimeout(close, 6000);

  const mock = (what) => toast({ s: "neutral", title: `${what} isn't in this sample` });

  // ---------- derived ----------

  }

  // ---------- sparkline ----------
  function spark(vals, w = 96, h = 32, color = "var(--accent)") {
    const max = Math.max(1, ...vals), n = vals.length;
    const pts = vals.map((v, i) => [(i / (n - 1)) * (w - 4) + 2, h - 3 - (v / max) * (h - 8)]);

    const gid = "g" + Math.random().toString(36).slice(2, 8);

      setStatus(id, s) {
        paint(id);
        if (s === "critical" && !calm()) {
          const n = nodes[id]; const o = { k: 0 };
          tweening++; tween(o, { k: 1 }, .9, () => { const p = Math.sin(o.k * Math.PI * 4); n.halo.scale.setScalar(n.r * 4.2 * (1 + Math.max(0, p) * .45)); dirty = true; kick(); }, () => { n.halo.scale.setScalar(n.r * 4.2); tweening--; dirty = true; kick(); });
        }
        dirty = true; kick();
      },
      setActive(on) { active = on; dirty = true; kick(); },
      theme: colors,
    };
    if ("IntersectionObserver" in window) new IntersectionObserver((en) => { inView = en[0].isIntersecting; kick(); }).observe(hero);
    document.addEventListener("visibilitychange", kick);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(hero); else addEventListener("resize", resize);
    rmq.addEventListener("change", () => { dirty = true; kick(); });
    resize(); colors();
    return api;
  }

  function themeChanged() { buildCharts(); scene && scene.theme(); }

  // ---------- live data (pauses when the tab is hidden) ----------
  setInterval(() => {
    if (document.hidden) return;
    SVC.forEach((s) => {
      if (s.s !== "good") return;
      s.cpu = Math.max(0, +(s.cpu + (rnd() - .5) * 1.4).toFixed(0));
      s.hist.push(s.cpu); s.hist.shift();
      const tr = $(`#svc-body tr[data-id="${s.id}"]`);
      if (tr) { const c = tr.querySelector("[data-cpu]"); if (c) c.textContent = s.cpu + "%"; const sp = tr.querySelector(".cellflex svg"); if (sp) sp.outerHTML = spark(s.hist.slice(-14), 44, 18); }
    });
    if (charts["ch-cpu"]) {
      const tNow = CPU[0].data[CPU[0].data.length - 1][0] + STEP;
      CPU.forEach((g, i) => { const lastV = g.data[g.data.length - 1][1]; g.data.push([tNow, Math.max(.5, +(lastV + (rnd() - .5) * (i ? 1.2 : 2.4)).toFixed(1))]); g.data.shift(); });
      charts["ch-cpu"].setOption({ series: CPU.map((g) => ({ data: g.data })) });
    }
    const m = 34 + Math.round(rnd() * 8); $("#m-cpu").style.width = m + "%"; $("#m-cpu-t").textContent = m + "%";
  }, 2500);

  // ---------- boot ----------
  renderStrip(); renderAlerts(); renderStats(true); renderTable(); renderFeed(); renderFallback(); bindTilt();
  if (window.THREE && webgl()) { try { scene = makeScene(); } catch (err) { scene = null; } }
  applyPerf();
  buildCharts();
})();
</script>
</body>
