<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: same shell as Home (dock + strip). Flow header → workflow strip → service swimlanes (the signature view) → events + detail. */
:root {
  --font-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --bg: #0c1012; --surface-1: #151c20; --surface-2: #1b2428; --fill: #1f292d; --fill-hover: #273338; --surface-inset: #090c0e;
  --line: rgba(170, 215, 225, .09); --line-strong: rgba(170, 215, 225, .18);
  --ink: #e6edef; --ink-2: #a7b4b8; --ink-3: #788890;
  --accent: #53d3e6; --accent-soft: rgba(83, 211, 230, .14); --on-accent: #04252b;
  --shadow: rgba(0, 0, 0, .55);
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --neutral: #788890;
  --r-ctl: 4px; --r-card: 4px; --r-sheet: 6px; --r-tag: 3px;
  --ease-out: cubic-bezier(.2, .7, .2, 1); --ease-move: cubic-bezier(.22, .9, .24, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e8edef; --surface-1: #fbfcfc; --surface-2: #ffffff; --fill: #e4eaec; --fill-hover: #d8e1e4; --surface-inset: #e4eaec;
    --line: rgba(12, 40, 48, .10); --line-strong: rgba(12, 40, 48, .20);
    --ink: #0d1517; --ink-2: #3d4b50; --ink-3: #5f6f75;
    --accent: #0a7c8f; --accent-soft: rgba(10, 124, 143, .10); --on-accent: #ffffff;
    --shadow: rgba(16, 40, 48, .20); --neutral: #5f6f75;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e8edef; --surface-1: #fbfcfc; --surface-2: #ffffff; --fill: #e4eaec; --fill-hover: #d8e1e4; --surface-inset: #e4eaec;
  --line: rgba(12, 40, 48, .10); --line-strong: rgba(12, 40, 48, .20);
  --ink: #0d1517; --ink-2: #3d4b50; --ink-3: #5f6f75;
  --accent: #0a7c8f; --accent-soft: rgba(10, 124, 143, .10); --on-accent: #ffffff;
  --shadow: rgba(16, 40, 48, .20); --neutral: #5f6f75;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/20px var(--font-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* shell (same as Home) */
.app { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 16px; max-width: 1520px; margin: 0 auto; padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.dock { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); align-self: start; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; background: var(--surface-1); border-radius: var(--r-sheet); }
.dock .logo { width: 36px; height: 36px; margin-bottom: 8px; display: grid; place-items: center; border-radius: var(--r-ctl); --mark-prompt: #4ee8b5; --mark-under: #2aeab4; }
.dock .logo:hover { background: var(--accent-soft); }
.dock .logo svg { width: 30px; height: 30px; display: block; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .dock .logo { --mark-prompt: #0b0f12; --mark-under: #0b0f12; } }
:root[data-theme="light"] .dock .logo { --mark-prompt: #0b0f12; --mark-under: #0b0f12; }
.dock hr { width: 24px; border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.dock-btn { position: relative; width: 40px; height: 40px; border-radius: var(--r-ctl); border: 0; background: transparent; display: grid; place-items: center; color: var(--ink-3); cursor: pointer; transition: background 100ms, color 100ms; }
.dock-btn svg { width: 20px; height: 20px; }
.dock-btn:hover { background: var(--accent-soft); color: var(--ink); }
.dock-btn[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.dock-btn[aria-current="page"]::before { content: ""; position: absolute; left: -9px; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--accent); }
.dock-btn .tip { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%) translateX(-4px); padding: 4px 8px; border-radius: var(--r-ctl); background: var(--ink); color: var(--bg); font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 100ms, transform 100ms; z-index: 5; }
.dock-btn:hover .tip, .dock-btn:focus-visible .tip { opacity: 1; transform: translateY(-50%); }
.dock .badge { position: absolute; top: 6px; right: 6px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 999px; background: var(--critical); color: #fff; font: 600 10px/15px var(--font-ui); }
.main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.strip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px; background: var(--surface-1); border-radius: var(--r-sheet); }
.strip .spacer { flex: 1; }
.chipbtn { height: 30px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: var(--r-ctl); border: 0; background: transparent; cursor: pointer; color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.chipbtn:hover { background: var(--accent-soft); color: var(--ink); }
.chipbtn b { color: var(--ink); font-weight: 600; }
.ws { color: var(--ink); font-weight: 600; background: var(--fill); }
.iconbtn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: var(--r-ctl); border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.iconbtn:hover { background: var(--accent-soft); color: var(--ink); }
.iconbtn svg { width: 17px; height: 17px; }
.btn { height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: var(--r-ctl); border: 0; background: var(--fill); color: var(--ink); font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap; transition: background 100ms, transform 100ms; }
.btn:hover { background: var(--fill-hover); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 14px; height: 14px; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.card { position: relative; min-width: 0; background: var(--surface-1); border-radius: var(--r-card); animation: rise 480ms var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * 40ms); }
@keyframes rise { from { transform: translateY(8px); opacity: .35; } to { transform: none; opacity: 1; } }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; }
.card-h h2 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; }
.grow { flex: 1; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.s5 { grid-column: span 5; } .s7 { grid-column: span 7; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--r-tag); font-size: 12px; font-weight: 500; white-space: nowrap; color: var(--ink); background: color-mix(in srgb, var(--c) 15%, transparent); }
.pill .si { color: var(--c); }
.si { width: 9px; height: 9px; flex: none; display: inline-block; }
[data-s="good"] { --c: var(--good); } [data-s="warning"] { --c: var(--warning); } [data-s="serious"] { --c: var(--serious); } [data-s="critical"] { --c: var(--critical); } [data-s="neutral"] { --c: var(--neutral); }
.seg { display: inline-flex; padding: 2px; border-radius: var(--r-ctl); background: var(--fill); }
.seg button { height: 24px; padding: 0 10px; border: 0; border-radius: var(--r-tag); background: transparent; color: var(--ink-3); font-size: 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface-1); color: var(--ink); }

/* flow header */
.fhead { padding: 14px 16px; display: grid; gap: 14px; }
.frow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fsearch { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; background: var(--fill); border-radius: var(--r-ctl); flex: 0 1 300px; min-width: 200px; color: var(--ink-3); }
.fsearch svg { width: 15px; height: 15px; flex: none; }
.fsearch input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 13px var(--font-mono); }
.fsearch input::placeholder { color: var(--ink-3); }
.recent { display: flex; gap: 4px; flex-wrap: wrap; }
.rchip { height: 32px; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--ink-2); font: 500 12px var(--font-mono); cursor: pointer; }
.rchip:hover { background: var(--fill); color: var(--ink); }
.rchip[aria-current="true"] { background: var(--accent-soft); color: var(--ink); }
.rchip .si { color: var(--c); }
.fid { font: 600 24px/30px var(--font-mono); letter-spacing: -.02em; }
.fwf { color: var(--ink-3); font-size: 13px; }
.verdict { height: 28px; padding: 0 10px; font-size: 13px; font-weight: 600; }
.dur { font: 500 13px var(--font-mono); color: var(--ink-2); }
.spacer { flex: 1; }
.srcs { display: flex; gap: 4px; flex-wrap: wrap; }
.src { height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: var(--r-tag); background: var(--fill); font: 600 10.5px var(--font-mono); letter-spacing: .05em; color: var(--ink-2); cursor: help; }
.src i { width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
.src.off { background: transparent; color: var(--ink-3); }
.src.off i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }

/* workflow strip */
.wf { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 16px 8px; position: relative; }
.wf .rail { position: absolute; left: calc(100% / 12); right: calc(100% / 12); top: 27px; height: 2px; background: var(--line-strong); border-radius: 2px; }
.wf .rail i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width 600ms var(--ease-out); }
.node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-2); }
.node .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-1); box-shadow: inset 0 0 0 2px var(--line-strong); color: var(--c, var(--ink-3)); }
.node .dot .si { width: 10px; height: 10px; }
.node[data-s="good"] .dot { background: color-mix(in srgb, var(--good) 18%, var(--surface-1)); box-shadow: none; }
.node[data-s="critical"] .dot, .node[data-s="serious"] .dot { background: color-mix(in srgb, var(--c) 22%, var(--surface-1)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent); }
.node[data-s="critical"], .node[data-s="serious"] { color: var(--ink); font-weight: 600; }
.node .t { font: 11px var(--font-mono); color: var(--ink-3); font-weight: 400; }

/* swimlanes */
.lanes-wrap { overflow-x: auto; padding: 6px 8px 12px; }
#lanes { display: block; width: 100%; min-width: 640px; overflow: visible; }
#lanes .lane-line { stroke: var(--line); }
#lanes .lane-label { font: 500 12px var(--font-mono); fill: var(--ink-2); }
#lanes .lane-label.culprit { fill: var(--critical); font-weight: 600; }
#lanes .lane-hl { fill: var(--critical); opacity: .08; }
#lanes .tick { stroke: var(--line); }
#lanes .tick-label { font: 11px var(--font-mono); fill: var(--ink-3); }
#lanes .span { fill: var(--accent); cursor: pointer; transition: opacity 120ms; }
#lanes .span.fail { fill: var(--critical); }
#lanes .span.slow { fill: var(--warning); }
#lanes .span.sel, #lanes .span:hover { stroke: var(--ink); stroke-width: 1.5; }
#lanes .wait { fill: url(#hatch); cursor: pointer; }
#lanes .wait-edge { stroke: var(--serious); stroke-width: 1.5; }
#lanes .hatch-line { stroke: var(--serious); stroke-width: 1.4; opacity: .7; }
#lanes .msg { stroke: var(--ink-3); stroke-width: 1.2; fill: none; }
#lanes .msg.sel { stroke: var(--accent); stroke-width: 2; }
#lanes .call { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
#lanes .arrow { fill: var(--ink-3); }
#lanes .mdot { fill: var(--surface-1); stroke: var(--accent); stroke-width: 2; cursor: pointer; }
#lanes .mdot.pending { stroke: var(--serious); }
#lanes .mdot.sel { fill: var(--accent); }
#lanes .now { stroke: var(--serious); stroke-dasharray: 4 3; }
#lanes .now-label { font: 600 11px var(--font-mono); fill: var(--serious); }
#lanes .pulse { fill: var(--accent); }
#lanes .pulse-halo { fill: var(--accent); opacity: .25; }
#lanes .hit { fill: transparent; cursor: pointer; }

/* events + detail */
.evlist { list-style: none; margin: 8px 0 0; padding: 0 0 6px; max-height: 420px; overflow-y: auto; }
.ev { display: grid; grid-template-columns: 58px 44px 82px minmax(0, 1fr) 12px; gap: 10px; align-items: center; padding: 7px 16px; cursor: pointer; font-size: 13px; }
.ev + .ev { border-top: 1px solid var(--line); }
.ev:hover { background: var(--surface-2); }
.ev.sel { background: var(--accent-soft); }
.ev .t { font: 12px var(--font-mono); color: var(--ink-3); }
.ev .svc { font: 500 12px var(--font-mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.ev.culprit .txt, .ev.culprit .svc { color: var(--ink); font-weight: 600; }
.ev .si { color: var(--c); justify-self: end; }
.tag { justify-self: start; font: 600 10px/16px var(--font-mono); letter-spacing: .04em; padding: 0 5px; border-radius: var(--r-tag); background: var(--fill); color: var(--ink-2); }
.tag[data-src="RULE"] { background: color-mix(in srgb, var(--serious) 18%, transparent); color: var(--ink); }
.tag[data-src="TEST"] { background: var(--accent-soft); color: var(--ink); }
.filters { display: flex; gap: 2px; }
.dt { padding: 12px 16px 16px; display: grid; gap: 14px; }
.dt-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dt-h .ttl { font: 600 14px var(--font-mono); overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; border-radius: var(--r-card); overflow: hidden; margin: 0; }
.kv div { background: var(--fill); padding: 8px 10px; min-width: 0; }
.kv dt { font-size: 11px; color: var(--ink-3); }
.kv dd { margin: 2px 0 0; font: 500 13px var(--font-mono); overflow-wrap: anywhere; }
pre.code { margin: 0; background: var(--surface-inset); border-radius: var(--r-ctl); padding: 10px 12px; font: 12px/18px var(--font-mono); color: var(--ink-2); overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 200px; }
.dt-a { display: flex; gap: 6px; flex-wrap: wrap; }

.toasts { position: fixed; z-index: 60; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 8px; }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--r-card); background: var(--surface-2); box-shadow: 0 20px 56px -20px var(--shadow); animation: toastin 220ms var(--ease-move); font-weight: 500; }
.toast .si { color: var(--c); }
@keyframes toastin { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

@media (max-width: 1100px) { .s5, .s7 { grid-column: span 12; } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .dock { position: static; flex-direction: row; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 6px; }
  .dock::-webkit-scrollbar { display: none; }
  .dock .logo, .dock-btn, .dock hr { flex: none; }
  .dock .logo { margin: 0 6px 0 0; }
  .dock hr { width: 1px; height: 24px; border-top: 0; border-left: 1px solid var(--line); margin: 0 4px; }
  .dock-btn[aria-current="page"]::before { left: 10px; right: 10px; top: auto; bottom: -7px; width: auto; height: 2px; }
  .dock-btn .tip { display: none; }
  .fsearch { flex: 1 1 100%; }
  .wf .t { display: none; }
  .ev { grid-template-columns: 52px 40px minmax(0, 1fr) 12px; }
  .ev .svc { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="dock" aria-label="Main">

    <div id="dock-items" style="display:contents"></div>
  </nav>

  <div class="main">
    <header class="strip" aria-label="Status">
      <button class="chipbtn ws" type="button" title="Workspace">infrabot <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      <a class="chipbtn" href="index.html" title="Stack full · services up" style="text-decoration:none"><svg class="si" viewBox="0 0 10 10" style="color:var(--critical)"><rect x=".8" y=".8" width="8.4" height="8.4" rx="1.2" fill="currentColor"/></svg><b class="num">12/14</b></a>
      <span class="spacer"></span>

    <section class="card fhead" style="--i:0" aria-label="Flow">

      <div class="frow">
        <span class="fid" id="fid"></span>
        <span class="fwf" id="fwf"></span>
        <span id="verdict"></span>
        <span class="dur num" id="dur"></span>

        <div class="srcs" id="srcs" aria-label="Data sources"></div>

        <button class="btn" type="button" id="test-flow" title="Run a synthetic linux-hardening flow against a dummy target"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/></svg>Test flow</button>
      </div>
    </section>

    <section class="card" style="--i:1" aria-label="Workflow nodes">
      <div class="wf" id="wf"></div>
    </section>

    <section class="card" style="--i:2" aria-labelledby="t-lanes">

        <h2 class="grow" id="t-lanes" title="One lane per service · bars = work · arrows = calls and NATS messages">Timeline</h2>

          <button type="button" data-z="all" aria-pressed="true">All</button>
          <button type="button" data-z="start" aria-pressed="false">Start</button>
          <button type="button" data-z="issue" aria-pressed="false">Issue</button>
        </div>
      </div>
      <div class="lanes-wrap"><svg id="lanes" role="img" aria-label="Service swimlanes"></svg></div>
    </section>

    <div class="grid">
      <section class="card s7" style="--i:3" aria-labelledby="t-ev">
        <div class="card-h"><h2 class="grow" id="t-ev">Events</h2><div class="seg filters" role="group" aria-label="Source filter" id="filters"></div></div>
        <ul class="evlist" id="events"></ul>
      </section>
      <section class="card s5" style="--i:4" aria-label="Selected event">
        <div class="dt" id="detail"></div>
      </section>
    </div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);

  const root = document.documentElement;

  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* unavailable */ } } };
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  const ICON = {

  const pill = (s, label, cls = "") => `<span class="pill ${cls}" data-s="${s}">${si(s)}${esc(label)}</span>`;

  // ---------- dock (same items as Home, Trace active) ----------

    ["Home", '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>', "index.html"],

    ["Repositories", '<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 5-12 2-12 7"/>'],

    ["Storage", '<path d="M4 7h16l-1.6 12.2a2 2 0 0 1-2 1.8H7.6a2 2 0 0 1-2-1.8z"/><ellipse cx="12" cy="7" rx="8" ry="2.5"/>', "storage.html"],
    ["Secrets", '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l2 2M15 8l2 2"/>', "secrets.html"],

  $("#dock-items").innerHTML = DOCK.map((d) => d === "|" ? "<hr>" :
    `<button class="dock-btn" type="button" ${d[2] ? `data-href="${d[2]}"` : `data-nav="${d[0]}"`} ${d[3] ? 'aria-current="page"' : ""} aria-label="${d[0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d[1]}</svg><span class="tip">${d[0]}</span></button>`).join("");

  function toast(s, title) {
    const el = document.createElement("div"); el.className = "toast"; el.dataset.s = s; el.setAttribute("role", "status");
    el.innerHTML = `${si(s)}<span>${esc(title)}</span>`;
    $("#toasts").appendChild(el); while ($("#toasts").children.length > 3) $("#toasts").firstElementChild.remove();
    setTimeout(() => el.remove(), 4500);
  }

  // ---------- flows (sample data) ----------
  // Each flow: events (merged timeline from DB / NATS / LOG / SPAN / RULE / TEST),
  // spans (bars on a lane), msgs (NATS hops), calls (HTTP hops), waits (gaps).
  const LANES = ["apisix", "ticket", "nats", "automation", "catalog", "backend", "openbao", "target"];
  const NODES = ["Operation", "Form", "Targets", "Approval", "Execution", "Notify"];
  const fmtT = (t) => t < 0 ? `−${Math.floor(-t / 60)}:${String(Math.round(-t % 60)).padStart(2, "0")}` : t >= 100 ? `${Math.floor(t / 60)}:${(t % 60).toFixed(0).padStart(2, "0")}` : t.toFixed(t < 10 ? 3 : 2);
  const fmtDur = (t) => t >= 60 ? `${Math.floor(t / 60)}m ${String(Math.round(t % 60)).padStart(2, "0")}s` : `${t.toFixed(1)} s`;

  function okFlow(id, ansible, job, test) {
    const tk = id.replace(/\D/g, "");
    const a = 1.38, z = a + ansible, T = z + 1.7;
    const E = [
      ["e1", 0, "LOG", "apisix", "good", "POST /tickets/workflow-executions · 201", { route: "/api/v1/tickets/workflow-executions", status: "201", latency: "47 ms", request_id: "9b1e2c40" }],
      ["e2", .004, "DB", "ticket", "good", `execution created · ${id}`, { table: "workflow_execution", ticket_id: tk, workflow: "linux-hardening" }],
      ["e3", .044, "DB", "ticket", "good", "outbox · ticket.updated", { table: "event_outbox", subject: "ticket.updated" }],
      ["e4", .9, "NATS", "ticket", "good", "ticket.updated", { subject: "ticket.updated", ticket_id: tk, node_code: "EXE_01", consumer: "automation-intake", delivered: "+30 ms" }],
      ["e5", .93, "LOG", "automation", "good", `intake · job ${job}`, { job_id: job, ticket_id: tk }],
      ["e6", 1.0, "LOG", "automation", "good", "GET catalog /playbooks/os-hardening-rhel9 · 200", { status: "200", latency: "96 ms" }],
      ["e7", 1.12, "LOG", "automation", "good", `GET backend /secrets/ssh/${test ? "dummy-target" : "target-03"} · 200`, { status: "200", latency: "180 ms" }],
      ["e8", 1.15, "LOG", "backend", "good", `openbao read kv/ssh/${test ? "dummy-target" : "target-03"}`, { mount: "kv", result: "ok (value not shown)" }],
      ["e9", a, "DB", "automation", "good", "ansible started · os-hardening-rhel9", { table: "job_steps", job_id: job }],
      ["e10", a + .01, "NATS", "automation", "good", "automation.run.started", { subject: "automation.run.started", job_id: job, ticket_id: tk }],
      ["e11", z - .1, "LOG", "target", "good", `${test ? "dummy-target" : "target-03"} · 23 ok · 7 changed`, { host: test ? "dummy-target" : "target-03", ok: "23", changed: "7", failed: "0" }],
      ["e12", z + .1, "NATS", "automation", "good", "automation.run.completed", { subject: "automation.run.completed", job_id: job, ticket_id: tk }],
      ["e13", z + .15, "DB", "ticket", "good", "EXE_01 done · notify", { table: "workflow_execution_step", node_code: "EXE_01", status: "completed" }],
      ["e14", T, "NATS", "ticket", "good", "ticket.updated · notify", { subject: "ticket.updated", ticket_id: tk }],
    ];
    if (test) E.push(["e15", T, "TEST", "devdeck", "good", "all nodes within budget", { Execution: `${fmtDur(ansible)} < 15m`, Approval: "auto", target: "dummy-target (container)" }]);
    return {
      id, wf: "linux-hardening", T, s: "good", verdict: test ? "Test passed" : "Completed", test,
      sources: test ? ["DB", "NATS", "LOG", "TEST"] : ["DB", "NATS", "LOG"],
      nodes: [["good", "0.0s"], ["good", "0.0s"], ["good", "0.0s"], ["good", "auto"], ["good", fmtDur(ansible)], ["good", "1.6s"]],
      issue: null,
      events: E,
      spans: [["apisix", 0, .047, "e1"], ["ticket", .004, .044, "e2"], ["automation", .93, 1.0, "e5"], ["catalog", 1.0, 1.1, "e6"], ["backend", 1.12, 1.3, "e7"], ["openbao", 1.15, 1.27, "e8"], ["automation", a, z, "e9"], ["target", a + .07, z - .1, "e11"], ["ticket", z + .15, z + .2, "e13"]],

      calls: [["automation", "catalog", 1.0, "e6"], ["automation", "backend", 1.12, "e7"], ["backend", "openbao", 1.15, "e8"], ["automation", "target", a + .07, "e11"]],

  const FAIL = {
    id: "TCK-1204", wf: "linux-hardening", T: 41.0, s: "critical", verdict: "target-07 unreachable",
    verdictTip: "Outside infrabot: SSH to 10.20.4.17:22 timed out. infrabot worked; the target host did not answer.",

    nodes: [["good", "0.0s"], ["good", "0.0s"], ["good", "0.0s"], ["good", "auto"], ["critical", "39.2s"], ["good", "0.3s"]],
    issue: { ev: "a11", lane: "target", t: 40.6 },
    events: [
      ["a1", 0, "LOG", "apisix", "good", "POST /tickets/workflow-executions · 201", { route: "/api/v1/tickets/workflow-executions", status: "201", latency: "52 ms", request_id: "7f3c90aa" }],
      ["a2", .004, "DB", "ticket", "good", "execution created · TCK-1204", { table: "workflow_execution", ticket_id: "1204", execution_id: "e-5521", workflow: "linux-hardening" }],
      ["a3", .046, "DB", "ticket", "good", "outbox · ticket.updated", { table: "event_outbox", subject: "ticket.updated" }],
      ["a4", .92, "NATS", "ticket", "good", "ticket.updated", { subject: "ticket.updated", ticket_id: "1204", node_code: "EXE_01", consumer: "automation-intake", delivered: "+30 ms" },
        '{\n  "ticket_id": 1204,\n  "tenant_id": "acme",\n  "node_code": "EXE_01",\n  "status": "in_progress"\n}'],
      ["a5", .95, "LOG", "automation", "good", "intake · job 88", { job_id: "88", ticket_id: "1204" }],
      ["a6", 1.05, "LOG", "automation", "good", "GET catalog /playbooks/os-hardening-rhel9 · 200", { status: "200", latency: "130 ms" }],
      ["a7", 1.19, "LOG", "automation", "good", "GET backend /secrets/ssh/target-07 · 200", { status: "200", latency: "220 ms" }],
      ["a8", 1.22, "LOG", "backend", "good", "openbao read kv/ssh/target-07", { mount: "kv", result: "ok (value not shown)" }],
      ["a9", 1.45, "DB", "automation", "good", "ansible started · os-hardening-rhel9", { table: "job_steps", job_id: "88", playbook: "os-hardening-rhel9" }],

      ["a14", 40.95, "NATS", "ticket", "good", "ticket.updated · notify", { subject: "ticket.updated", ticket_id: "1204" }],

    spans: [["apisix", 0, .052, "a1"], ["ticket", .004, .048, "a2"], ["automation", .95, 1.05, "a5"], ["catalog", 1.05, 1.18, "a6"], ["backend", 1.19, 1.41, "a7"], ["openbao", 1.22, 1.36, "a8"], ["automation", 1.45, 40.62, "a9", "fail"], ["target", 1.52, 40.6, "a11", "fail"], ["ticket", 40.69, 40.74, "a13", "fail"]],
    msgs: [["ticket", "automation", .92, .95, "a4"], ["automation", "ticket", 1.46, 1.48, "a10"], ["automation", "ticket", 40.66, 40.69, "a12"], ["ticket", "backend", 40.95, 40.97, "a14"]],
    calls: [["automation", "catalog", 1.05, "a6"], ["automation", "backend", 1.19, "a7"], ["backend", "openbao", 1.22, "a8"], ["automation", "target", 1.52, "a11"]],

  const STUCK = {
    id: "TCK-1199", wf: "linux-hardening", T: 129, s: "critical", verdict: "Stuck · automation not consuming",
    verdictTip: "ticket.updated was published 2m 09s ago. Consumer automation-intake has 1 pending message and 0 active subscribers.",
    sources: ["DB", "NATS", "LOG"],
    nodes: [["good", "0.0s"], ["good", "0.0s"], ["good", "0.0s"], ["good", "auto"], ["serious", "2m 09s"], ["neutral", "—"]],
    issue: { ev: "b5", lane: "automation", t: 129 },
    events: [
      ["b0", -95, "LOG", "automation", "critical", "nats: connection closed · subscriber stopped", { service: "automation-service", at: "10:39:12", error: "nats: connection closed" },

  const FLOWS = [FAIL, STUCK, okFlow("TCK-1190", 148.3, "86", false), okFlow("TEST-0007", 33.9, "85", true)];
  let flow = FLOWS[0], selected = null, zoom = "all", srcFilter = "All";

  // ---------- header ----------
  function renderRecent() {
    $("#recent").innerHTML = FLOWS.map((f) => `<button class="rchip" type="button" role="listitem" data-flow="${f.id}" data-s="${f.s}" ${f === flow ? 'aria-current="true"' : ""} title="${esc(f.verdict)}">${si(f.s)}${f.id}</button>`).join("");
  }
  const SRC_TIP = {
    DB: "Workflow DB · ticket workflow_execution(_step), automation jobs/job_steps/job_events",
    NATS: "NATS tap · ticket.>, automation.> and JetStream consumer stats",
    LOG: "Logs joined by ticket_id / job_id",
    SPAN: "OpenTelemetry traces · not wired in infrabot yet (plan 04 §6)",
    TEST: "Synthetic flow test",
  };
  function renderHead() {
    $("#fid").textContent = flow.id;
    $("#fwf").textContent = flow.wf;
    $("#verdict").innerHTML = pill(flow.s, flow.verdict, "verdict");
    $("#verdict").title = flow.verdictTip || "";
    $("#dur").textContent = flow.s === "critical" && flow.waits.length ? `${fmtDur(flow.T)} · waiting` : fmtDur(flow.T);
    const all = ["DB", "NATS", "LOG", "SPAN"].concat(flow.test ? ["TEST"] : []);
    $("#srcs").innerHTML = all.map((s) => `<span class="src ${flow.sources.includes(s) ? "" : "off"}" title="${SRC_TIP[s]}"><i></i>${s}</span>`).join("");
    const w = flow.nodes;
    const firstBad = w.findIndex((n) => n[0] !== "good");
    const reached = firstBad === -1 ? w.length - 1 : firstBad;
    $("#wf").innerHTML = `<div class="rail"><i style="width:${(reached / (w.length - 1)) * 100}%"></i></div>` + NODES.map((n, i) => `<div class="node" data-s="${w[i][0]}" title="${n} · ${w[i][1]}"><span class="dot">${si(w[i][0])}</span>${n}<span class="t">${w[i][1]}</span></div>`).join("");
    document.title = `${flow.id} · devdeck Flow Trace`;
  }

  // ---------- swimlanes ----------
  const LANE_H = 36, TOP = 28, LABEL = 104, PAD_R = 18;
  let W = 900, X0 = 0, X1 = 1;
  const yOf = (lane) => TOP + LANES.indexOf(lane) * LANE_H + LANE_H / 2;
  const xOf = (t) => LABEL + ((t - X0) / (X1 - X0)) * (W - LABEL - PAD_R);
  function domain() {
    if (zoom === "start") return [0, 2];
    if (zoom === "issue" && flow.issue) {
      if (flow.waits.length) return [0, flow.T * 1.02];
      return [Math.max(0, flow.issue.t - 2.5), flow.issue.t + .8];
    }
    return [0, flow.T * 1.03];
  }
  function niceStep(span) {
    const steps = [.1, .2, .25, .5, 1, 2, 5, 10, 15, 20, 30, 60, 120];
    return steps.find((s) => span / s <= 8) || 300;
  }
  const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };
  function drawLanes() {
    const svg = $("#lanes");
    W = Math.max(640, svg.parentElement.clientWidth - 16);
    const H = TOP + LANES.length * LANE_H + 8;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.innerHTML = "";
    [X0, X1] = domain();
    const defs = el("defs", {}, svg);
    const pat = el("pattern", { id: "hatch", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
    el("line", { x1: 0, y1: 0, x2: 0, y2: 6, class: "hatch-line" }, pat);
    const clip = el("clipPath", { id: "plot" }, defs); el("rect", { x: LABEL, y: 0, width: W - LABEL - PAD_R + 2, height: H }, clip);
    const mk = el("marker", { id: "arr", viewBox: "0 0 6 6", refX: 5, refY: 3, markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0 0L6 3L0 6z", class: "arrow" }, mk);

    // lanes
    LANES.forEach((ln, i) => {
      const y = TOP + i * LANE_H;
      if (flow.issue && flow.issue.lane === ln) el("rect", { x: 0, y, width: W, height: LANE_H, class: "lane-hl" }, svg);
      el("line", { x1: 0, x2: W, y1: y + LANE_H, y2: y + LANE_H, class: "lane-line" }, svg);
      const t = el("text", { x: 4, y: y + LANE_H / 2 + 4, class: "lane-label" + (flow.issue && flow.issue.lane === ln ? " culprit" : "") }, svg);
      t.textContent = ln;
    });
    // ticks
    const step = niceStep(X1 - X0);
    for (let t = Math.ceil(X0 / step) * step; t <= X1 + 1e-9; t += step) {
      const x = xOf(t);
      el("line", { x1: x, x2: x, y1: TOP - 4, y2: TOP + LANES.length * LANE_H, class: "tick" }, svg);
      const lb = el("text", { x, y: TOP - 10, "text-anchor": "middle", class: "tick-label" }, svg);
      lb.textContent = t >= 60 ? `${Math.floor(t / 60)}m${t % 60 ? (t % 60) + "s" : ""}` : `${+t.toFixed(2)}s`;
    }
    const g = el("g", { "clip-path": "url(#plot)" }, svg);
    // waits (gaps where something should have happened)
    flow.waits.forEach(([ln, t0, t1, ev]) => {
      const x = xOf(t0), w = Math.max(3, xOf(t1) - x), y = yOf(ln) - 8;
      const r = el("rect", { x, y, width: w, height: 16, class: "wait", "data-ev": ev }, g); el("title", {}, r).textContent = "waiting · nothing consumed the message";
      el("line", { x1: x, x2: x + w, y1: y, y2: y, class: "wait-edge" }, g);
      el("line", { x1: x, x2: x + w, y1: y + 16, y2: y + 16, class: "wait-edge" }, g);
    });
    // spans
    flow.spans.forEach(([ln, t0, t1, ev, cls]) => {
      const x = xOf(t0), w = Math.max(3, xOf(t1) - x);
      const r = el("rect", { x, y: yOf(ln) - 7, width: w, height: 14, rx: 2, class: "span " + (cls || ""), "data-ev": ev }, g);
      const e = evById(ev); el("title", {}, r).textContent = `${ln} · ${e ? e[5] : ""} · ${fmtDur(t1 - t0)}`;
    });
    // HTTP calls (caller → callee)
    flow.calls.forEach(([from, to, t]) => {
      const x = xOf(t), y1 = yOf(from), y2 = yOf(to);
      el("line", { x1: x, x2: x, y1: y1 + (y2 > y1 ? 7 : -7), y2: y2 + (y2 > y1 ? -8 : 8), class: "call", "marker-end": "url(#arr)" }, g);
    });
    // NATS hops (publisher → nats → consumer)
    flow.msgs.forEach(([from, to, t1, t2, ev]) => {
      const x1 = xOf(t1), yn = yOf("nats"), yf = yOf(from);
      el("line", { x1, x2: x1, y1: yf + (yn > yf ? 7 : -7), y2: yn + (yn > yf ? -7 : 7), class: "msg", "data-msg": ev, "marker-end": "url(#arr)" }, g);
      if (t2 != null) {
        const x2 = xOf(t2), yt = yOf(to);
        el("path", { d: `M${x1} ${yn}C${x1 + 18} ${yn},${x2 - 4} ${(yn + yt) / 2},${x2} ${yt + (yt > yn ? -8 : 8)}`, class: "msg", "data-msg": ev, "marker-end": "url(#arr)" }, g);
      }
      const d = el("circle", { cx: x1, cy: yn, r: 5, class: "mdot" + (t2 == null ? " pending" : ""), "data-ev": ev }, g);
      const e = evById(ev); el("title", {}, d).textContent = e ? e[5] : "";
    });
    // "now" marker for an unfinished flow
    if (flow.waits.length) {
      const x = xOf(flow.T);
      el("line", { x1: x, x2: x, y1: TOP - 4, y2: TOP + LANES.length * LANE_H, class: "now" }, svg);
      const lb = el("text", { x: x - 4, y: TOP - 10, "text-anchor": "end", class: "now-label" }, svg); lb.textContent = "now";
    }
    markSelected();
  }
  const evById = (id) => flow.events.find((e) => e[0] === id);

  // ---------- events + detail ----------
  function renderFilters() {
    const srcs = ["All"].concat([...new Set(flow.events.map((e) => e[2]))]);
    if (!srcs.includes(srcFilter)) srcFilter = "All";
    $("#filters").innerHTML = srcs.map((s) => `<button type="button" data-src="${s}" aria-pressed="${s === srcFilter}">${s === "All" ? "All" : s}</button>`).join("");
  }
  function renderEvents() {
    const list = flow.events.filter((e) => srcFilter === "All" || e[2] === srcFilter).slice().sort((a, b) => a[1] - b[1]);
    $("#events").innerHTML = list.map((e) => {
      const culprit = flow.issue && flow.issue.ev === e[0];
      return `<li class="ev ${culprit ? "culprit" : ""} ${selected === e[0] ? "sel" : ""}" data-ev="${e[0]}" data-s="${e[4]}" tabindex="0"><span class="t num">${fmtT(e[1])}</span><span class="tag" data-src="${e[2]}">${e[2]}</span><span class="svc">${esc(e[3])}</span><span class="txt" title="${esc(e[5])}">${esc(e[5])}</span>${e[4] !== "good" ? si(e[4]) : "<span></span>"}</li>`;
    }).join("");
  }
  function renderDetail() {
    const e = evById(selected); if (!e) { $("#detail").innerHTML = ""; return; }
    const [id, t, src, svc, s, text, kv, code, actions] = e;
    const culprit = flow.issue && flow.issue.ev === id;
    $("#detail").innerHTML = `
      <div class="dt-h">${pill(s, culprit ? "Cause" : src)}<span class="ttl">${esc(svc)}</span><span class="mono num" style="color:var(--ink-3);font-size:12px">${fmtT(t)}</span></div>
      <div style="font-weight:600">${esc(text)}</div>
      <dl class="kv">${Object.entries(kv || {}).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
      ${code ? `<pre class="code">${esc(code)}</pre>` : ""}
      <div class="dt-a">${(actions || [["", "Logs"], ["", "VS Code"]]).map(([k, l]) => `<button class="btn sm ${k}" type="button" data-act="${esc(l)}">${esc(l)}</button>`).join("")}</div>`;
  }
  function markSelected() {
    $$("#lanes [data-ev]").forEach((n) => n.classList.toggle("sel", n.dataset.ev === selected));
    $$("#lanes [data-msg]").forEach((n) => n.classList.toggle("sel", n.dataset.msg === selected));
  }
  function select(id, scroll) {
    selected = id; renderEvents(); renderDetail(); markSelected();
    if (scroll) { const li = $(`#events [data-ev="${id}"]`); li && li.scrollIntoView({ block: "nearest" }); }
  }

  // ---------- replay: a light pulse walks the hops in time order ----------
  let replaying = 0;
  function replay() {
    if (calm()) return;
    cancelAnimationFrame(replaying);
    const pts = [];
    flow.spans.forEach(([ln, t0]) => pts.push([t0, ln]));
    flow.msgs.forEach(([from, to, t1, t2]) => { pts.push([t1, from], [t1 + 1e-4, "nats"]); if (t2 != null) pts.push([t2, to]); });
    flow.calls.forEach(([from, to, t]) => pts.push([t + 1e-4, to]));
    pts.sort((a, b) => a[0] - b[0]);
    const path = pts.filter(([t]) => t >= X0 && t <= X1).map(([t, ln]) => [xOf(t), yOf(ln)]);
    if (path.length < 2) return;
    const svg = $("#lanes");
    const halo = el("circle", { r: 10, class: "pulse-halo" }, svg), dot = el("circle", { r: 4.5, class: "pulse" }, svg);
    const seg = path.slice(1).map((p, i) => Math.hypot(p[0] - path[i][0], p[1] - path[i][1]));
    const total = seg.reduce((a, b) => a + b, 0), dur = 2600, st = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - st) / dur); let d = k * total, i = 0;
      while (i < seg.length - 1 && d > seg[i]) { d -= seg[i]; i++; }
      const f = seg[i] ? d / seg[i] : 0, x = path[i][0] + (path[i + 1][0] - path[i][0]) * f, y = path[i][1] + (path[i + 1][1] - path[i][1]) * f;
      dot.setAttribute("cx", x); dot.setAttribute("cy", y); halo.setAttribute("cx", x); halo.setAttribute("cy", y);
      if (k < 1) replaying = requestAnimationFrame(step); else { dot.remove(); halo.remove(); }
    };
    replaying = requestAnimationFrame(step);
  }

  // ---------- wiring ----------
  function show(f) {
    flow = f; zoom = "all"; srcFilter = "All";
    selected = f.issue ? f.issue.ev : f.events[f.events.length - 1][0];
    $$("#zoom button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.z === zoom)));
    $$("#zoom button")[2].hidden = !f.issue;
    renderRecent(); renderHead(); renderFilters(); drawLanes(); renderEvents(); renderDetail();
    try { history.replaceState(null, "", "#" + f.id); } catch (e) { /* sandboxed */ }
  }
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-flow],[data-z],[data-src],[data-ev],[data-msg],[data-act],[data-href],[data-nav]");
    if (!t) return;
    if (t.dataset.flow) show(FLOWS.find((f) => f.id === t.dataset.flow));
    else if (t.dataset.z) { zoom = t.dataset.z; $$("#zoom button").forEach((b) => b.setAttribute("aria-pressed", String(b === t))); drawLanes(); }
    else if (t.dataset.src) { srcFilter = t.dataset.src; renderFilters(); renderEvents(); }
    else if (t.dataset.ev) select(t.dataset.ev, true);
    else if (t.dataset.msg) select(t.dataset.msg, true);
    else if (t.dataset.act) toast("neutral", `${t.dataset.act} isn't in this sample`);
    else if (t.dataset.href) location.href = t.dataset.href;
    else if (t.dataset.nav) toast("neutral", `${t.dataset.nav} isn't in this sample`);
  });
  $("#events").addEventListener("keydown", (e) => {
    const li = e.target.closest(".ev"); if (!li) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(li.dataset.ev); }
    if (e.key === "ArrowDown" && li.nextElementSibling) { e.preventDefault(); li.nextElementSibling.focus(); select(li.nextElementSibling.dataset.ev); }
    if (e.key === "ArrowUp" && li.previousElementSibling) { e.preventDefault(); li.previousElementSibling.focus(); select(li.previousElementSibling.dataset.ev); }
  });
  $("#replay").addEventListener("click", replay);
  $("#flow-q").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const q = e.target.value.trim().toUpperCase().replace(/^#/, "");
    const f = FLOWS.find((x) => x.id === q || x.id.endsWith(q) || x.events.some((ev) => Object.values(ev[6] || {}).includes(q.toLowerCase()) || Object.values(ev[6] || {}).includes(q)));
    if (f) { show(f); e.target.value = ""; } else toast("neutral", `No flow for ${q}`);
  });
  let testN = 8;
  $("#test-flow").addEventListener("click", (e) => {
    const b = e.currentTarget; b.disabled = true;
    const id = `TEST-${String(testN++).padStart(4, "0")}`;
    toast("neutral", `${id} started`);
    setTimeout(() => {
      const f = okFlow(id, 31 + Math.round(Math.random() * 6), String(90 + testN), true);
      FLOWS.push(f); show(f); replay(); b.disabled = false;
      toast("good", `${id} passed`);
    }, 1800);
  });
  // theme
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
  const saved = store.get("dd-theme"); if (saved === "light" || saved === "dark") root.dataset.theme = saved;
  $("#theme-toggle").addEventListener("click", () => { root.dataset.theme = isDark() ? "light" : "dark"; store.set("dd-theme", root.dataset.theme); });
  if (window.ResizeObserver) new ResizeObserver(() => drawLanes()).observe($(".lanes-wrap")); else addEventListener("resize", drawLanes);

  const start = FLOWS.find((f) => "#" + f.id === location.hash) || FLOWS[0];
  show(start);
  if (!calm()) setTimeout(replay, 500);
})();
</script>
</body>
</html>
