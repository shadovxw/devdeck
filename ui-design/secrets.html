85%20320H12L92%20244H185C250%20244%20280%20190%20270%20173L175%2076H92Z%22%20fill%3D%22url(%23fu)%22%2F%3E%20%3Cg%20clip-path%3D%22url(%23fc)%22%3E%3Cpath%20d%3D%22M0%20212L262%20168L320%20138H340V340H0Z%22%20fill%3D%22url(%23fl)%22%2F%3E%3C%2Fg%3E%20%3Cpath%20class%3D%22p%22%20d%3D%22M118%20128L152%20160L118%20192%22%20fill%3D%22none%22%20stroke-width%3D%2220%22%20stroke-linecap%3D%22square%22%2F%3E%3Crect%20class%3D%22u%22%20x%3D%22166%22%20y%3D%22184%22%20width%3D%2256%22%20height%3D%2219%22%20rx%3D%222%22%2F%3E%3C%2Fsvg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: page header (seal state, KPIs, snapshot) → path tree + policies (left) | secret detail with versions (right). */
.tree { list-style: none; margin: 6px 0 0; padding: 0 0 8px; }
.node { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 calc(12px + var(--d, 0) * 16px); cursor: pointer; font: 500 13px var(--font-mono); color: var(--ink-2); min-width: 0; }
.node:hover { background: var(--surface-2); color: var(--ink); }
.node[aria-current="true"] { background: var(--accent-soft); color: var(--ink); }
.node svg { width: 14px; height: 14px; flex: none; color: var(--ink-3); }
.node[data-dir] svg.chev { transition: transform 120ms; }
.node[aria-expanded="true"] svg.chev { transform: rotate(90deg); }
.node .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.node .v { font-size: 11px; color: var(--ink-3); }
.node.del .nm { text-decoration: line-through; color: var(--ink-3); }
.treesearch { display: flex; align-items: center; gap: 6px; height: 30px; margin: 10px 16px 0; padding: 0 8px; background: var(--fill); border-radius: var(--r-ctl); color: var(--ink-3); }
.treesearch svg { width: 14px; height: 14px; flex: none; }
.treesearch input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 12px var(--font-mono); }
.dpane { padding: 14px 16px 16px; display: grid; gap: 14px; align-content: start; min-height: 520px; }
.dtop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.meta-line { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); }
.meta-line b { color: var(--ink-2); font-weight: 500; font-family: var(--font-mono); }
.kvt { width: 100%; }
.kvt td { height: 42px; }
.kvt td.k { font: 500 13px var(--font-mono); width: 30%; }
.kvt td.v { font: 13px var(--font-mono); color: var(--ink-2); max-width: 0; overflow: hidden; text-overflow: ellipsis; }
.kvt td.v.shown { color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; padding-block: 8px; }
.kvt tbody tr { cursor: default; }
.kvt td.a { width: 64px; text-align: right; }
.edit-rows { display: grid; gap: 6px; }
.erow { display: grid; grid-template-columns: minmax(0, 30%) minmax(0, 1fr) 28px; gap: 6px; align-items: start; }
.erow textarea { min-height: 32px; height: 32px; resize: vertical; padding: 6px 10px; line-height: 20px; }
.erow textarea.masked { -webkit-text-security: disc; }
.bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.state { padding: 16px; border-radius: var(--r-ctl); background: var(--surface-inset); color: var(--ink-2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.state .si { color: var(--c); }
.empty { padding: 60px 16px; text-align: center; color: var(--ink-3); display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 28px; height: 28px; }
.pathin { display: flex; align-items: center; gap: 0; }
.pathin span { height: 32px; display: grid; place-items: center; padding: 0 8px 0 10px; background: var(--surface-inset); border-radius: var(--r-ctl) 0 0 var(--r-ctl); font: 13px var(--font-mono); color: var(--ink-3); }
.pathin .input { border-radius: 0 var(--r-ctl) var(--r-ctl) 0; }
.err { font-size: 12px; color: var(--critical); }
</style>
</head>
<body data-page="Secrets">
<div class="app">
  <nav class="dock" id="dock" aria-label="Main"></nav>
  <div class="main">
    <header class="strip" id="strip" aria-label="Status"></header>

    <section class="card phead" style="--i:0" aria-label="Secrets">
      <h1>Secrets</h1>
      <span class="tag" title="devdeck talks to OpenBao from this PC. The OpenBao web UI stays closed. Values are never logged or sent to Claude.">openbao-local · 127.0.0.1</span>
      <span id="seal"></span>
      <span class="spacer"></span>
      <div class="kpis" id="kpis"></div>
      <button class="btn sm" type="button" id="snapshot" title="Save every secret, encrypted with your Windows login, so you can restore after OpenBao restarts"></button>
      <button class="btn sm" type="button" id="restore" title="Write the last snapshot back into OpenBao"></button>
    </section>

    <div class="grid">
      <section class="card s4" style="--i:1" aria-labelledby="t-tree">
        <div class="card-h"><h2 class="grow" id="t-tree" title="KV v2 engine mounted at secret/">secret/</h2><button class="iconbtn sm" type="button" id="new-secret" title="New secret" aria-label="New secret"></button></div>
        <label class="treesearch" for="tq"><span id="tq-ic"></span><input id="tq" type="text" placeholder="Find a path" autocomplete="off" spellcheck="false"></label>
        <ul class="tree" id="tree" role="tree" aria-label="Secret paths"></ul>
        <div class="sub-h">Policies</div>
        <ul class="list" id="policies"></ul>
      </section>

      <section class="card s8" style="--i:2" aria-label="Secret">
        <div class="dpane" id="pane"></div>
      </section>
    </div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="shell.js"></script>
<script>
(() => {
  "use strict";
  const { $, esc, si, pill, svg, I, toast, confirmClick, copy } = window.DD;
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const day = 864e5, NOW = Date.now();
  const ago = (ms) => { const m = Math.round((NOW - ms) / 6e4); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
  const CHEV = '<path d="M9 6l6 6-6 6"/>';

  // ---------- sample data: dummy dev values only (what devdeck would read via the KV v2 API) ----------
  const v = (data, daysAgo, state) => ({ data, created: NOW - daysAgo * day, state: state || "live" });
  const SSH_KEY = "openssh private key (sample, not real)";
  const SECRETS = {
    "tenants/acme/providers/ocp-prod": [v({ api_url: "https://api.ocp.acme.local:6443", username: "svc-infrabot", password: "dev-pass-ocp-1" }, 30), v({ api_url: "https://api.ocp.acme.local:6443", username: "svc-infrabot", password: "dev-pass-ocp-2" }, 12, "destroyed"), v({ api_url: "https://api.ocp.acme.local:6443", username: "svc-infrabot", password: "dev-pass-ocp-3" }, 2)],
    "tenants/acme/providers/aws-dev": [v({ access_key_id: "AKIADEVEXAMPLE00001", secret_access_key: "dev/EXAMPLE/secret/key", region: "ap-south-1" }, 20)],
    "tenants/acme/ssh/target-07": [v({ username: "ansible", private_key: SSH_KEY }, 9), v({ username: "ansible", private_key: SSH_KEY, port: "22" }, 1)],
    "tenants/acme/ssh/target-03": [v({ username: "ansible", private_key: SSH_KEY }, 9)],
    "tenants/globex/providers/nutanix": [v({ endpoint: "https://prism.globex.local:9440", username: "admin", password: "dev-pass-ntnx" }, 15)],
    "platform/keycloak-admin": [v({ username: "admin", password: "dev-pass-kc" }, 40)],
    "platform/smtp-relay": [v({ host: "mailhog", port: "1025", username: "", password: "" }, 40)],
    "platform/garage-dev-key": [v({ access_key_id: "GK3a9f5c1e0d7b42a6c8e1f0aa", secret_access_key: "dev-garage-secret" }, 76)],
    "platform/osticket-api": [v({ base_url: "http://osticket.local", api_key: "dev-osticket-key" }, 8), v({ base_url: "http://osticket.local", api_key: "dev-osticket-key-2" }, .5, "deleted")],
    "ci/dockerhub": [v({ username: "citiuscloud-ci", token: "dckr_pat_dev_example" }, 5)],
  };
  const POLICIES = {
    "default": 'path "auth/token/lookup-self" {\n  capabilities = ["read"]\n}',
    "backend-rw": 'path "secret/data/*" {\n  capabilities = ["create", "read", "update", "delete"]\n}\npath "secret/metadata/*" {\n  capabilities = ["list", "read"]\n}',
    "devdeck-ro": 'path "secret/metadata/*" {\n  capabilities = ["list", "read"]\n}\n# values readable only after you click Reveal\npath "secret/data/*" {\n  capabilities = ["read"]\n}',
    "root": "# built-in: full access (dev mode token)",
  };
  let current = null, version = null, mode = "view", open = new Set(["tenants", "tenants/acme", "platform"]), tq = "", policy = null, snapshot = null;

  // ---------- header ----------
  function renderHead() {
    $("#seal").innerHTML = pill("good", "Unsealed", "OpenBao · dev mode · KV v2 at secret/") + " " + pill("warning", "In-memory", "Dev mode keeps secrets in memory. Restarting the container wipes them. Use Snapshot / Restore.");
    const n = Object.keys(SECRETS).length, vers = Object.values(SECRETS).reduce((a, s) => a + s.length, 0);
    $("#kpis").innerHTML = `<div class="kpi"><b class="num">${n}</b><span>secrets</span></div><div class="kpi"><b class="num">${vers}</b><span>versions</span></div><div class="kpi"><b class="num">${Object.keys(POLICIES).length}</b><span>policies</span></div>`;
    $("#restore").disabled = !snapshot;
  }

  // ---------- tree ----------
  function buildTree() {
    const root = {};
    Object.keys(SECRETS).sort().forEach((p) => { let n = root; p.split("/").forEach((seg, i, a) => { n[seg] = n[seg] || (i === a.length - 1 ? { __leaf: p } : {}); n = n[seg]; }); });
    return root;
  }
  const latest = (p) => SECRETS[p][SECRETS[p].length - 1];
  function renderTree() {
    const out = [];
    if (tq) {
      Object.keys(SECRETS).filter((p) => p.toLowerCase().includes(tq.toLowerCase())).sort().forEach((p) => out.push(leaf(p, p, 0)));
    } else {
      const walk = (node, path, d) => Object.keys(node).sort((a, b) => (!!node[a].__leaf - !!node[b].__leaf) || a.localeCompare(b)).forEach((k) => {
        const n = node[k], full = path ? path + "/" + k : k;
        if (n.__leaf) { out.push(leaf(n.__leaf, k, d)); return; }
        const ex = open.has(full);
        out.push(`<li class="node" role="treeitem" data-dir="${esc(full)}" aria-expanded="${ex}" style="--d:${d}" tabindex="0">${svg(CHEV, 2).replace("<svg", '<svg class="chev"')}<span class="nm">${esc(k)}/</span></li>`);
        if (ex) walk(n, full, d + 1);
      });
      walk(buildTree(), "", 0);
    }
    $("#tree").innerHTML = out.join("") || `<li class="node" style="cursor:default">No match</li>`;
  }
  function leaf(path, label, d) {
    const L = latest(path), del = L.state !== "live";
    return `<li class="node ${del ? "del" : ""}" role="treeitem" data-path="${esc(path)}" ${current === path ? 'aria-current="true"' : ""} style="--d:${d}" tabindex="0" title="${esc(path)}">${svg(I.lock)}<span class="nm">${esc(label)}</span><span class="v">v${SECRETS[path].length}</span></li>`;
  }
  function renderPolicies() {
    $("#policies").innerHTML = Object.keys(POLICIES).map((p) => `<li class="li" data-policy="${p}" ${policy === p ? 'aria-current="true"' : ""} tabindex="0">${svg(I.shield)}<span class="nm">${p}</span></li>`).join("");
  }

  // ---------- detail pane ----------
  const crumbs = (p) => `<nav class="crumbs grow" aria-label="Path"><button type="button" data-goto="">secret</button>${p.split("/").map((s, i, a) => `<span class="sep">/</span><button type="button" ${i < a.length - 1 ? `data-goto="${esc(a.slice(0, i + 1).join("/"))}"` : ""}>${esc(s)}</button>`).join("")}</nav>`;
  function renderPane() {
    const pane = $("#pane");
    if (policy) {
      pane.innerHTML = `<div class="dtop"><span class="crumbs grow"><button type="button">sys/policies/acl</button><span class="sep">/</span><button type="button">${esc(policy)}</button></span>${pill("neutral", "View only", "Policies are edited in infrabot's setup scripts, not here")}</div><pre class="code">${esc(POLICIES[policy])}</pre>`;
      return;
    }
    if (mode === "new") return renderNew();
    if (!current) { pane.innerHTML = `<div class="empty">${svg(I.lock)}<div>Pick a secret, or create one.</div></div>`; return; }
    const vs = SECRETS[current], V = vs[version - 1];
    const seg = `<div class="seg" role="group" aria-label="Version">${vs.map((x, i) => `<button type="button" data-ver="${i + 1}" aria-pressed="${i + 1 === version}" title="${x.state === "live" ? ago(x.created) : x.state}">v${i + 1}${x.state !== "live" ? "·" : ""}</button>`).join("")}</div>`;
    const top = `<div class="dtop">${crumbs(current)}${seg}</div>
      <div class="meta-line"><span>Version <b>${version} of ${vs.length}</b></span><span>Updated <b>${ago(vs[vs.length - 1].created)}</b></span><span>Created <b>${ago(vs[0].created)}</b></span><span>Max versions <b>10</b></span></div>`;
    if (mode === "edit") return renderEdit(top, V);
    let body;
    if (V.state === "deleted") body = `<div class="state" data-s="warning">${si("warning")}<span class="grow">Version ${version} is deleted. Data is hidden but recoverable.</span><button class="btn sm primary" type="button" data-undelete>Undelete</button></div>`;
    else if (V.state === "destroyed") body = `<div class="state" data-s="critical">${si("critical")}<span>Version ${version} was destroyed. It can't be recovered.</span></div>`;
    else body = `<div class="twrap"><table class="kvt"><thead><tr><th>Key</th><th>Value</th><th class="r"><span class="sr">Actions</span></th></tr></thead><tbody>
      ${Object.entries(V.data).map(([k, val]) => `<tr><td class="k">${esc(k)}</td><td class="v" data-val="${esc(k)}">${val ? "••••••••••••" : '<span class="faint">empty</span>'}</td><td class="a">${val ? `<span style="display:inline-flex;gap:2px"><button class="iconbtn sm" type="button" data-reveal="${esc(k)}" title="Reveal for 20 s" aria-label="Reveal ${esc(k)}">${svg(I.eye)}</button><button class="iconbtn sm" type="button" data-copyval="${esc(k)}" title="Copy" aria-label="Copy ${esc(k)}">${svg(I.copy)}</button></span>` : ""}</td></tr>`).join("")}
      </tbody></table></div>`;
    const isLatest = version === vs.length;
    const bar = `<div class="bar">
      ${V.state === "live" ? `<button class="btn sm ${isLatest ? "primary" : ""}" type="button" data-edit>${svg(I.edit)}${isLatest ? "Edit" : "Restore as new version"}</button>` : ""}
      <span class="spacer"></span>
      ${V.state === "live" ? `<button class="btn sm danger" type="button" data-delver title="Soft delete. Undelete brings it back.">${svg(I.trash)}Delete v${version}</button>` : ""}
      ${V.state !== "destroyed" ? `<button class="btn sm danger" type="button" data-destroy title="Permanently destroy this version's data">Destroy v${version}</button>` : ""}
      <button class="btn sm danger" type="button" data-purge title="Remove every version and the metadata">Delete secret</button>
    </div>`;
    pane.innerHTML = top + body + bar;
  }
  function editRows(data, withKeys = true) {
    return `<div class="edit-rows" id="rows">${Object.entries(data).map(([k, val]) => erow(k, val)).join("")}</div><div><button class="btn sm ghost" type="button" data-addrow>${svg(I.plus)}Add key</button></div>`;
  }
  const erow = (k = "", val = "") => `<div class="erow"><input class="input mono" data-k placeholder="key" value="${esc(k)}" aria-label="Key" autocomplete="off" spellcheck="false"><textarea class="input mono masked" data-v placeholder="value" aria-label="Value" spellcheck="false">${esc(val)}</textarea><button class="iconbtn sm" type="button" data-rmrow title="Remove" aria-label="Remove row">${svg(I.x)}</button></div>`;
  function renderEdit(top, V) {
    $("#pane").innerHTML = `${top}<form id="edit-form" style="display:grid;gap:12px">${editRows(V.data)}
      <div class="err" id="err" hidden></div>
      <div class="bar"><button class="btn sm primary" type="submit">${svg(I.save)}Save as v${SECRETS[current].length + 1}</button><button class="btn sm ghost" type="button" data-cancel>Cancel</button><span class="spacer"></span><button class="btn sm ghost" type="button" data-showvals title="Show values while editing">${svg(I.eye)}Show values</button></div></form>`;
  }
  function renderNew() {
    $("#pane").innerHTML = `<div class="dtop"><span class="crumbs grow"><button type="button">secret</button><span class="sep">/</span><button type="button">new</button></span></div>
      <form id="new-form" style="display:grid;gap:12px">
        <label class="pathin" for="np"><span>secret/</span><input class="input mono" id="np" placeholder="tenants/acme/ssh/target-11" autocomplete="off" spellcheck="false"></label>
        ${editRows({ "": "" })}
        <div class="err" id="err" hidden></div>
        <div class="bar"><button class="btn sm primary" type="submit">${svg(I.save)}Create</button><button class="btn sm ghost" type="button" data-cancel>Cancel</button><span class="spacer"></span><button class="btn sm ghost" type="button" data-showvals>${svg(I.eye)}Show values</button></div>
      </form>`;
    setTimeout(() => $("#np") && $("#np").focus(), 0);
  }
  function readRows() {
    const data = {}, rows = $$("#rows .erow");
    for (const r of rows) {
      const k = r.querySelector("[data-k]").value.trim(), val = r.querySelector("[data-v]").value;
      if (!k && !val) continue;
      if (!k) return { err: "Every value needs a key" };
      if (data[k] !== undefined) return { err: `Key “${k}” is used twice` };
      data[k] = val;
    }
    if (!Object.keys(data).length) return { err: "Add at least one key" };
    return { data };
  }
  const showErr = (m) => { const e = $("#err"); e.hidden = false; e.textContent = m; };

  function select(p) {
    current = p; version = SECRETS[p].length; mode = "view"; policy = null;
    p.split("/").slice(0, -1).reduce((a, s) => { const x = a ? a + "/" + s : s; open.add(x); return x; }, "");
    renderTree(); renderPolicies(); renderPane();
  }

  // ---------- events ----------
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-dir],[data-path],[data-policy],[data-goto],[data-ver],[data-reveal],[data-copyval],[data-edit],[data-cancel],[data-addrow],[data-rmrow],[data-showvals],[data-delver],[data-destroy],[data-purge],[data-undelete],#new-secret,#snapshot,#restore");
    if (!t) return;
    if (t.dataset.dir) { const d = t.dataset.dir; open.has(d) ? open.delete(d) : open.add(d); renderTree(); }
    else if (t.dataset.path) select(t.dataset.path);
    else if (t.dataset.policy) { policy = t.dataset.policy; current = null; mode = "view"; renderTree(); renderPolicies(); renderPane(); }
    else if (t.dataset.goto !== undefined) { const g = t.dataset.goto; g.split("/").reduce((a, s) => { const p = a ? a + "/" + s : s; if (p) open.add(p); return p; }, ""); tq = g; $("#tq").value = g; renderTree(); }
    else if (t.dataset.ver) { version = +t.dataset.ver; mode = "view"; renderPane(); }
    else if (t.dataset.reveal) {
      const k = t.dataset.reveal, cell = $(`#pane td[data-val="${CSS.escape(k)}"]`), val = SECRETS[current][version - 1].data[k];
      const shown = cell.classList.toggle("shown");
      cell.textContent = shown ? val : "••••••••••••"; t.innerHTML = svg(shown ? I.eyeoff : I.eye);
      if (shown) setTimeout(() => { if (cell.isConnected && cell.classList.contains("shown")) { cell.classList.remove("shown"); cell.textContent = "••••••••••••"; t.innerHTML = svg(I.eye); } }, 20000);
    }
    else if (t.dataset.copyval) copy(SECRETS[current][version - 1].data[t.dataset.copyval], t.dataset.copyval);
    else if (t.dataset.edit !== undefined) { mode = "edit"; renderPane(); }
    else if (t.dataset.cancel !== undefined) { mode = "view"; renderPane(); }
    else if (t.dataset.addrow !== undefined) { $("#rows").insertAdjacentHTML("beforeend", erow()); $$("#rows [data-k]").pop().focus(); }
    else if (t.dataset.rmrow !== undefined) { t.closest(".erow").remove(); }
    else if (t.dataset.showvals !== undefined) { const on = $$("#rows textarea").some((x) => x.classList.contains("masked")); $$("#rows textarea").forEach((x) => x.classList.toggle("masked", !on)); t.innerHTML = `${svg(on ? I.eyeoff : I.eye)}${on ? "Hide values" : "Show values"}`; }
    else if (t.dataset.delver !== undefined) confirmClick(t, `Delete v${version}?`, () => { SECRETS[current][version - 1].state = "deleted"; renderTree(); renderPane(); toast("good", `Deleted v${version} · recoverable`, { label: "Undelete", fn: () => { SECRETS[current][version - 1].state = "live"; renderTree(); renderPane(); } }); });
    else if (t.dataset.destroy !== undefined) confirmClick(t, "Destroy forever?", () => { const V = SECRETS[current][version - 1]; V.state = "destroyed"; V.data = {}; renderTree(); renderPane(); renderHead(); toast("good", `Destroyed v${version}`); });
    else if (t.dataset.purge !== undefined) confirmClick(t, `Delete all ${SECRETS[current].length} versions?`, () => { const p = current; delete SECRETS[p]; current = null; renderTree(); renderPane(); renderHead(); toast("good", `Deleted ${p}`); });
    else if (t.dataset.undelete !== undefined) { SECRETS[current][version - 1].state = "live"; renderTree(); renderPane(); toast("good", `Restored v${version}`); }
    else if (t.id === "new-secret") { mode = "new"; current = null; policy = null; renderTree(); renderPolicies(); renderPane(); }
    else if (t.id === "snapshot") { snapshot = JSON.parse(JSON.stringify(SECRETS)); renderHead(); toast("good", `Snapshot saved · ${Object.keys(snapshot).length} secrets`); }
    else if (t.id === "restore") confirmClick(t, "Overwrite OpenBao?", () => { Object.keys(SECRETS).forEach((k) => delete SECRETS[k]); Object.assign(SECRETS, JSON.parse(JSON.stringify(snapshot))); current = null; mode = "view"; renderTree(); renderPane(); renderHead(); toast("good", `Restored ${Object.keys(SECRETS).length} secrets`); });
  });
  document.addEventListener("submit", (e) => {
    e.preventDefault();
    const r = readRows(); if (r.err) return showErr(r.err);
    if (e.target.id === "edit-form") {
      SECRETS[current].push(v(r.data, 0)); version = SECRETS[current].length; mode = "view";
      renderTree(); renderPane(); renderHead(); toast("good", `Saved ${current.split("/").pop()} as v${version}`);
    }
    if (e.target.id === "new-form") {
      const p = $("#np").value.trim().replace(/^secret\//, "").replace(/^\/+|\/+$/g, "");
      if (!/^[a-zA-Z0-9._\-]+(\/[a-zA-Z0-9._\-]+)*$/.test(p)) return showErr("Path: letters, numbers, . _ - separated by /");
      if (SECRETS[p]) return showErr("A secret already exists at that path");
      SECRETS[p] = [v(r.data, 0)];
      p.split("/").slice(0, -1).reduce((a, s) => { const x = a ? a + "/" + s : s; open.add(x); return x; }, "");
      renderHead(); select(p); toast("good", `Created secret/${p}`);
    }
  });
  document.addEventListener("keydown", (e) => {
    const n = e.target.closest && e.target.closest(".node,[data-policy]");
    if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); n.click(); }
  });
  $("#tq").addEventListener("input", (e) => { tq = e.target.value.trim(); renderTree(); });

  $("#new-secret").innerHTML = svg(I.plus); $("#tq-ic").innerHTML = svg(I.search);
  $("#snapshot").innerHTML = `${svg(I.snapshot)}Snapshot`; $("#restore").innerHTML = `${svg(I.restore)}Restore`;
  renderHead(); renderTree(); renderPolicies();
  select("tenants/acme/ssh/target-07");
})();
</script>
</body>
</html>
